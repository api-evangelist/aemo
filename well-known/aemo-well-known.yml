description: >-
  Result of probing the RFC 8615 /.well-known/ discovery surface across every public AEMO host.
  AEMO publishes an RFC 9116 security.txt on the corporate site and an OpenID Connect discovery
  document for the Azure AD B2C tenant that fronts the DER Register consumer-registration API.
  No /.well-known/api-catalog, ai-plugin.json, oauth-authorization-server or openid-configuration
  is published on the developer portal or the API gateway hosts.
notes:
  - The corporate site (www.aemo.com.au / aemo.com.au) sits behind a WAF that answers automated
    clients with HTTP 403 on nearly every path; /.well-known/security.txt is served normally.
  - nemweb.com.au answers automated clients with HTTP 403 across the board, so its /.well-known/
    surface could not be established either way.
