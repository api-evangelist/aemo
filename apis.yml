- aid: aemo:aemo-nemweb-public-data-feed
  name: AEMO NEMWeb Public Data Feed
  description: >-
    NEMWeb is AEMO's open bulk-data channel for the National Electricity Market and the single largest
    genuinely open energy dataset in Australia. It is not a REST API — it is an anonymously browsable
    HTTP directory tree of zipped CSV reports, refreshed on dispatch, daily and settlement cycles, and
    it is how the entire Australian energy analytics industry gets its data. Confirmed on 2026-07-27:
    GET https://nemweb.com.au/Reports/Current/ returned HTTP 200 listing 103 report directories — Dispatch_Reports,
    DispatchIS_Reports, Dispatch_SCADA, Bidmove_Complete, Billing, Marginal_Loss_Factors, Market_Notice,
    Medium_Term_PASA_Reports, Next_Day_*, Network, ROOFTOP_PV, TradingIS_Reports and more — and GET /Reports/Archive/
    returned HTTP 200 with a further 68 archive directories. A sample file, /Reports/CURRENT/DispatchIS_Reports/PUBLIC_DISPATCHIS_202607252230_0000000529244762.zip,
    downloaded with HTTP 200 and 18,252 bytes of application/x-zip-compressed with no credential of any
    kind. The MMS Data Model that describes the CSV schemas is published separately at /Reports/Current/MMSDataModelReport.
  humanURL: https://nemweb.com.au/Reports/Current/
  baseURL: https://nemweb.com.au/Reports
  tags:
  - National Electricity Market
  - Open Data
  - Bulk Data
  - Dispatch
  - Prices
  - Settlement
  - Bidding
  - Energy
  - Australia
