- aid: aemo:aemo-b2bmessagingpull
  name: AEMO B2BMessagingPull
  description: 'The B2BMessagingPull API is a B2B SMP API used to send and receive B2B messages between
    the participants in a Pull messaging pattern. The messages will be queued in the e-Hub and the receiving
    participant can poll the e-Hub, ‘pull’ and process the messages that are queued. AEMO''s public API
    catalogue lists 4 operation(s) for this API, gateway-routed under the path prefix /ws/B2BMessagingPull.
    AEMO''s own openapi-link export for this API is a shell — it declares paths: {} with zero operations
    and names an internal host — so the 4 operation(s) in the OpenAPI captured here were harvested from
    AEMO''s developer-portal operations endpoints (https://dev.aemo.com.au/developer/apis/b2bmessaging-pull-v1/operations?api-version=2022-04-01-preview),
    complete with parameters, headers, response codes and response examples. Harvested 2026-07-27 (HTTP
    200).'
