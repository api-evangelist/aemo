- aid: aemo:aemo-wa-market-data-public-feed
  name: AEMO WA Market Data Public Feed
  description: >-
    The Western Australian equivalent of NEMWeb, covering the Wholesale Electricity Market that AEMO operates
    separately from the NEM. Confirmed anonymous and live on 2026-07-27: GET https://data.wa.aemo.com.au/public/
    returned HTTP 200 with directory listings for market-data, public-data, outages, advisories, infographic
    and INF, and GET /public/market-data/ returned HTTP 200 exposing capo, dsp, mt-pasa, outages, st-pasa
    and wemde subdirectories — the WEM Dispatch Engine outputs, short and medium term PASA, demand side
    programme and capacity data. Like NEMWeb it is an open HTTP file tree rather than a REST API, and
    like NEMWeb it needs no key, account or licence.
  humanURL: https://data.wa.aemo.com.au/public/
  baseURL: https://data.wa.aemo.com.au/public
