- aid: aemo:aemo-b2bmessagingpull
  name: AEMO B2BMessagingPull
  description: 'The B2BMessagingPull API is a B2B SMP API used to send and receive B2B messages between
    the participants in a Pull messaging pattern. The messages will be queued in the e-Hub and the
    receiving participant can poll the e-Hub, ‘pull’ and process the messages that are queued. AEMO''s
    public API catalogue lists 4 operation(s) for this API, gateway-routed under the path prefix
    /ws/B2BMessagingPull. The OpenAPI document AEMO exports for it publicly is a shell: it carries
    the title, description and API-key security schemes but declares paths: {} — zero operations
    — and names an internal host rather than a reachable gateway. Harvested verbatim on 2026-07-27
    (HTTP 200).'
