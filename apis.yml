- aid: aemo:aemo-b2bmessagingpull-api
  name: AEMO B2 B Messaging Pull API
  description: >-
    The B2BMessagingPull API is a B2B SMP API used to send and receive B2B messages between the participants
    in a Pull messaging pattern. The messages will be queued in the e-Hub and the receiving participant
    can poll the e-Hub, ‘pull’ and process the messages that are queued.
