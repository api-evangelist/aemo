apis:
- aid: aemo:aemo-nem-data-dashboard-api
  name: AEMO NEM Data Dashboard API
  description: >-
    The JSON API behind AEMO's public National Electricity Market data dashboard, and
    the closest thing AEMO operates to an open real-time market API. Confirmed live and
    fully anonymous on 2026-07-27: GET /aemo/apps/api/report/ELEC_NEM_SUMMARY returned
    HTTP 200 with five-minute regional records for NSW1, QLD1, SA1, TAS1 and VIC1 —
    settlement date, spot price and price status, total demand, net interconnector
    interchange, scheduled and semi-scheduled generation, administered-price and
    market-suspension flags, per-interconnector flows with export and import limits —
    plus a full FCAS price set (raise/lower regulation and 1s, 6s, 60s and 5min
    contingency) and the ten most recent AEMO electricity market notices. POST
    /aemo/apps/api/report/5MIN with body {"timeScale":["5MIN"]} returned HTTP 200 with a
    rolling five-minute regional price and demand series. No API key, no account, no
    licence, no rate-limit challenge. It is also entirely undocumented — AEMO publishes
    no reference, no schema and no terms for it, so it is recorded here as a verified
    public endpoint rather than as a supported product.
  humanURL: https://visualisations.aemo.com.au/aemo/apps/visualisations/index.html
  baseURL: https://visualisations.aemo.com.au/aemo/apps/api/report
  tags:
  - National Electricity Market
  - Open Data
  - Real Time
  - Prices
  - Demand
  - Generation
  - Interconnectors
  - FCAS
  - Energy
  - Australia
  properties:
  - type: Documentation
    url: https://visualisations.aemo.com.au/aemo/apps/visualisations/index.html
  - type: Website
    url: https://visualisations.aemo.com.au/
- aid: aemo:aemo-nemweb-public-data-feed
  name: AEMO NEMWeb Public Data Feed
  description: >-
    NEMWeb is AEMO's open bulk-data channel for the National Electricity Market and the
    single largest genuinely open energy dataset in Australia. It is not a REST API — it
    is an anonymously browsable HTTP directory tree of zipped CSV reports, refreshed on
    dispatch, daily and settlement cycles, and it is how the entire Australian energy
    analytics industry gets its data. Confirmed on 2026-07-27: GET
    https://nemweb.com.au/Reports/Current/ returned HTTP 200 listing 103 report
    directories — Dispatch_Reports, DispatchIS_Reports, Dispatch_SCADA, Bidmove_Complete,
    Billing, Marginal_Loss_Factors, Market_Notice, Medium_Term_PASA_Reports, Next_Day_*,
    Network, ROOFTOP_PV, TradingIS_Reports and more — and GET /Reports/Archive/ returned
    HTTP 200 with a further 68 archive directories. A sample file,
    /Reports/CURRENT/DispatchIS_Reports/PUBLIC_DISPATCHIS_202607252230_0000000529244762.zip,
    downloaded with HTTP 200 and 18,252 bytes of application/x-zip-compressed with no
    credential of any kind. The MMS Data Model that describes the CSV schemas is
    published separately at /Reports/Current/MMSDataModelReport.
  humanURL: https://nemweb.com.au/Reports/Current/
  baseURL: https://nemweb.com.au/Reports
  tags:
  - National Electricity Market
  - Open Data
  - Bulk Data
  - Dispatch
  - Prices
  - Settlements
  - Bidding
  - Energy
  - Australia
  properties:
  - type: Documentation
    url: https://nemweb.com.au/Reports/Current/MMSDataModelReport/
  - type: DataFeed
    url: https://nemweb.com.au/Reports/Current/
  - type: Archive
    url: https://nemweb.com.au/Reports/Archive/
- aid: aemo:aemo-wa-market-data-public-feed
  name: AEMO WA Market Data Public Feed
  description: >-
    The Western Australian equivalent of NEMWeb, covering the Wholesale Electricity
    Market that AEMO operates separately from the NEM. Confirmed anonymous and live on
    2026-07-27: GET https://data.wa.aemo.com.au/public/ returned HTTP 200 with directory
    listings for market-data, public-data, outages, advisories, infographic and INF, and
    GET /public/market-data/ returned HTTP 200 exposing capo, dsp, mt-pasa, outages,
    st-pasa and wemde subdirectories — the WEM Dispatch Engine outputs, short and medium
    term PASA, demand side programme and capacity data. Like NEMWeb it is an open HTTP
    file tree rather than a REST API, and like NEMWeb it needs no key, account or
    licence.
  humanURL: https://data.wa.aemo.com.au/public/
  baseURL: https://data.wa.aemo.com.au/public
