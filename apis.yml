- aid: aemo:aemo-b2mmessagingpull
  name: AEMO B2MMessagingPull
  description: 'The B2MMessagingPull push-pull API supports inbound submitMessages, submitMessageAcknowledgements,
    getMessages, and getQueueMetaData endpoints and suits low volume exchange of messages. Participants
    using B2MMessagingPull are responsible for implementing the polling logic to poll their Participant
    Hub Queue to retrieve new messages, similar to batch programs used to poll their outbox using
    FTP. AEMO''s public API catalogue lists 4 operation(s) for this API, gateway-routed under the
    path prefix /NEMRetail/B2MMessagingPull. The OpenAPI document AEMO exports for it publicly is
