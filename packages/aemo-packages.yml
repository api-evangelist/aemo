source: >-
  npm registry search, PyPI, CRAN, and the AEMO developer portal
  (https://dev.aemo.com.au/working-with-aemo-apis)
description: >-
  AEMO publishes NO first-party client libraries or SDKs in any language. Its developer portal ships
  OpenAPI documents, a Postman collection and TLS certificate self-service, and nothing else — there
  is no aemo package on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or
  crates.io, and no AEMO GitHub organisation was found. What does exist is a mature ecosystem of
  third-party, mostly academic, libraries for AEMO's PUBLIC data (NEMWeb and the MMSDM archive) —
  none of which touch the authenticated e-Hub participant APIs. They are catalogued here, marked
  official: false, because they are how most people actually consume AEMO data.
