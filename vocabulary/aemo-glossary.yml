name: AEMO Glossary and Rules Terms
description: AEMO's published glossary of common terms, acronyms, abbreviations and measurements used across Australia's
  National Electricity Market, Wholesale Electricity Market and gas markets, harvested verbatim from the Markets
  Portal Help glossary. Terms defined in the National Electricity Rules / National Gas Rules are noted as Rules
  terms on the source page.
publisher: Australian Energy Market Operator (AEMO)
related:
- https://aemo.com.au/learn/industry-terminology
- https://tech-specs.docs.public.aemo.com.au/Content/TOC_common-topics-DOnotChange/Glossary.htm
term_count: 1151
terms:
- term: 10% POE demand
  definition: 10% of the actual demand values are expected above. 90% of the actual demand values are expected below
- term: 30-min Period
  definition: Term replacing Trading Interval, where the period remains 30 minutes
- term: 5-Minute Pre-dispatch
  definition: Five minute resolution, one hour ahead.
- term: 50% POE demand
  definition: Implies there is a 50% probability of the forecast being met or exceeded. Also known as Demand50
- term: 5MLP
  definition: Five-minute Load Profile
- term: 5MPD
  definition: 5-minute Pre-dispatch
- term: 90% POE demand
  definition: 90% of the actual demand values are expected above. 10% of the actual demand values are expected below
- term: ABARES
  definition: Australian Bureau of Agricultural and Resource Economics and Sciences. The research arm of the Australian
    Government Department of Agriculture and Water Resources that provides professionally independent data, research,
    analysis and advice to inform public and private decisions affecting Australian agriculture, fisheries and forestry.
- term: Accelerate
  definition: 'A process initiated by AEMO to complete in-progress Change Requests following a ROLR Event, allowing
    for: • Completion of Change Requests otherwise requiring the MDP to submit the Actual Change Date, where that
    date is not yet submitted. • Specification of an Actual Change Date (RoLR Effective Transfer Date) to supersede
    any existing Proposed Change Date or Actual Change Date on the Change Request.'
- term: Accept
  definition: A Recipient of a B2B Message has agreed to process it further.
- term: Access Requirements
  definition: 'Specific site access requirements associated with the conduct of a Service Order. See B2B Procedures:
    Customer & Site Details Notification Process and B2B Procedures: Service Orders Process.'
- term: Account-holder
  definition: Any person (non-NSP) holding an account with AEMO that allows access to the DER Register. This may
    be a DER installer or someone acting on behalf of a DER installer.
- term: Accreditation
  definition: The full process to become accredited as a B2B e-Hub Participant from application form to application
    successful.
- term: Accreditation Checklists
  definition: The questions an applicant for Accreditation as MDP, MP or ENM must complete to be accredited.
- term: Accredited Service Provider (ASP)
  definition: Electrically qualified personnel accredited to perform certain electrical works by the NSW or ACT
    Government.
- term: Accumulation Meter
  definition: A device complying with Australian Standards, containing a measurement element(s) and a record of
    the accumulated quantity of the electricity flowing through the power conductor. Also know as a basic meter.
- term: ACE
  definition: Adjusted Consumed Energy
- term: ACK
  definition: An acknowledgement file from AEMO with a filename extension of .ACK. The file contains messages to
    acknowledge the success of another file.
- term: Acknowledgement File
  definition: 'A file containing a Message Acknowledgement. See B2B Procedures: Technical Delivery Specification.'
- term: ACMA
  definition: Australian Communications and Media Authority
- term: Actual Change Date
  definition: The effective date of changes specified in a Change Request. The same date as the FromDate in a C4
    Report and the Start Date in MSATS interfaces displaying NMI master data.
- term: Actual End Date
  definition: A date specifying the end of a period when updating existing data in CATS. It is only specified in
    a Change Request for a Retrospective Change correcting a past error.
- term: Actual Meter Read Date
  definition: The date an actual meter reading is obtained.
- term: Actual Meter Reading
  definition: The accumulated metering data or interval metering data collected from a meter either manually or
    by remote acquisition (as applicable).
- term: Actual Metering Data
  definition: Accumulated metering data or interval metering data that has passed Validation without Substitution.
- term: ADC
  definition: Aggregated Dispatch Conformance
- term: Additive adjustment
  definition: Average actual adjustment window energy – average baseline adjustment window energy. This may be positive
    or negative.
- term: ADE
  definition: Aggregate Dispatch Error
- term: Adjustment window
  definition: If the event starts in trading interval t, then this is trading intervals t-48, to t-13 (that is,
    the three hours ending one hour before the start of the event). The adjustment will apply across all demand
    response trading intervals during the dispatch of a demand response. Rules are required to manage a scenario
    where the adjustment interval contains a demand response interval .
- term: ADL
  definition: Average Daily Load. The average daily consumption of electricity by a customer.
- term: AEDT
  definition: Australian Easter Daylight Time (AEDT) is in use from the first Sunday in October to the first Sunday
    in April during Daylight Saving Time (DST). AEDT is used during the remainder of the year.
- term: AEMC
  definition: Australian Energy Market Commission. The rule maker for Australian electricity and gas markets.
- term: AEMO
  definition: Australian Energy Market Operator
- term: AEMO API Gateway
  definition: The gateway on AEMO’s side providing participant communication options, accessible over the internet
    or MarketNet. It uses resources and methods to push messages to Participants’ API Gateways .
- term: AEMO Communication
  definition: An email from AEMO to a distribution list of Registered Participant contacts broadcasting NEM-related
    information.
- term: AEMO Security Model
  definition: The entities and rights assigned to participants to maintain access rights to different parts of the
    system.
- term: AEMO System Administrator
  definition: Creates the initial participant administrator ID with the PA right assigned, for each organisation.
- term: AER
  definition: See Relevant Rules or Procedures
- term: AES
  definition: Advanced Encryption Standard
- term: AEST
  definition: Australian Eastern Standard Time (market time)
- term: AGC
  definition: Automatic Generation Control. A process that detects minor deviations in power system frequency and
    sends raise or lower signals to generating units providing regulation.
- term: AGE
  definition: Adjusted Gross Energy. The amount of energy to be adjusted for a trading interval.
- term: Agent Participants
  definition: See Relevant Rules or Procedures
- term: Aggregation
  definition: An aggregation implies there are at least two or more classified NMIs in the dispatchable unit for
    central dispatch.
- term: Agreement type
  definition: Specifies the type of reallocation transaction where a reallocation can have one of two different
    agreement types—A fixed dollar amount ($) or a fixed quantity amount (GJ).
- term: Allocated Units
  definition: See Relevant Rules or Procedures
- term: AMI
  definition: Advanced Metering Infrastructure. An integrated system of meters, communications networks, and data
    management systems that enables two-way communication between providers and customers.
- term: Ancillary Service Prices
  definition: See Relevant Rules or Procedures
- term: Ancillary Services
  definition: See Relevant Rules or Procedures
- term: ANEMOS
  definition: International consortium responsible for design and supply of AWEFS/ASEFS. AWEFS/ASEFS is also commonly
    referred to as ANEMOS.
- term: ANTS
  definition: Annual National Transmission Statement. A document outlining AEMO’s vision for national transmission
    planning.
- term: APA
  definition: See Relevant Rules or Procedures
- term: APC
  definition: Administrative Price Cap
- term: API
  definition: Application Programming Interface; a set of clearly defined methods of communication between various
    software components.
- term: API e-Hub
  definition: Consists of the API Portal and the API Gateway for electricity and gas.
- term: API Gateway
  definition: Part of AEMO's API -e-Hub used by participants and AEMO to push or pull messages using RESTful APIs.
    Some APIs are accessible over the internet and MarketNet.
- term: API Portal
  definition: Part of AEMO's e-Hub used for API registration, certificates, and as a resource for downloading Open
    API Specifications (OAS).
- term: API Protocol
  definition: An AEMO API delivery method.
- term: APLNG
  definition: Australia Pacific LNG. Australia’s largest producer of natural gas sourced from coal seams in eastern
    Australia.
- term: Application Portal
  definition: Web applications for non-registered participants and Registered Participants. Does not require access
    to MarketNet.
- term: Appointment
  definition: An agreement between a retail customer (or their agent), a retailer and a participant for the participant
    to perform requested work at a specified time.
- term: Approved Schema Version
  definition: 'A version of the aseXML schema approved by the aseXML Working Group, or its successors. Refer B2B
    Procedures: Technical Delivery Specification.'
- term: APR
  definition: Annual Planning Report. Reports from transmission planning businesses, outlining potential future
    needs for network replacement or augmentation in the NEM.
- term: ARENA
  definition: Australian Renewable Energy Agency. An agency established by the Australian government in 2012 to
    improve the competitiveness of renewable energy technologies and increase the supply of renewable energy in
    Australia.
- term: As Generated
  definition: Electricity supplied to the grid by scheduled, semi-scheduled, and significant non-scheduled generators,
    including their auxiliary loads, and electricity used by a generator
- term: ASEFS
  definition: Australian Solar Energy Forecasting System. Designed to produce solar generation forecasts for large
    solar power stations and small-scale distributed photovoltaic (PV) systems, covering forecasting timeframes
    from 5 minutes to 2 years.
- term: aseXML
  definition: A standard for energy transactions in XML. A set of schemas and usage guidelines that define how data
    should be exchanged under FRC in the gas and electricity industries in Australia.
- term: aseXML Document
  definition: 'Refer to aseXML Message. See B2B Procedures: Technical Delivery Specification.'
- term: aseXML Guidelines
  definition: Guidelines for the development of a Standard for Energy Transactions in XML (aseXML).
- term: aseXML Message Handler
  definition: 'Software that manages aseXML message interactions. See B2B Procedures: Technical Delivery Specification.'
- term: aseXML schema
  definition: Specification to describe the structure of an aseXML message.
- term: aseXML transaction
  definition: See Transaction.
- term: aseXML wrapped CSV transaction
  definition: 'An aseXML transaction that includes CSV formatted data. See B2B Procedures: Technical Delivery Specification.'
- term: ASGU
  definition: Ancillary Services Generating Unit
- term: ASL
  definition: Ancillary Services Load (currently excludes generators or batteries)
- term: ASOE
  definition: Adjusted Sent Out Energy
- term: ASP
  definition: Accredited Service Provider, providing connection services in NSW.
- term: Asset Management Strategy
  definition: A strategy for the testing of metering installations submitted by an MC and approved by AEMO under
    clause S7.6 of the NER.
- term: ASU
  definition: Ancillary Services Unit (new under IESS rule change encapsulating both generation and load)
- term: ASWG
  definition: aseXML Standards Working Group
- term: ASX
  definition: Australian Securities Exchange
- term: Auction Agreement
  definition: See Relevant Rules or Procedures
- term: Auction Participant
  definition: See Relevant Rules or Procedures
- term: Auction Participation Agreement
  definition: See Relevant Rules or Procedures
- term: Auxiliary Loads
  definition: Energy generated for use within power stations, excluding pumped hydro. Electricity consumed to charge
    battery storage facilities is a primary input and treated as a Market Load. Also called Parasitic Load or Self-load
- term: Average actual adjustment window energy
  definition: The simple average of the metered energy over the adjustment window.
- term: Average baseline adjustment window energy
  definition: The simple average of the unadjusted baseline energy over the adjustment window.
- term: Average Cancellation Price
  definition: See Relevant Rules or Procedures
- term: AWEFS
  definition: Australian Wind Energy Forecasting System. Established in response to the growth in intermittent generation
    in the NEM, and the increasing impact this growth was having on NEM forecasting processes. The system aims to
    provide better forecasts that will drive improved efficiency of overall NEM dispatch and pricing, and permit
    better network stability and security management.
- term: B2B
  definition: Business-to-Business. Generic term used to refer to defined business-to-business interactions between
    participants; excludes interactions between a participant and market systems such as MSATS.
- term: B2B Acknowledgement
  definition: A generic term used to refer to an aseXML message or transaction acknowledgement, specifically within
    the context of a B2B interaction. A B2B acknowledgement is the physical interpretation of a Business Signal.
    Often referred to as being positive (indicating correctness of the associated file) or negative (indicating
    an error with the associated file).
- term: B2B Browser
  definition: A web interface supporting the creation and management of a defined set of business-to-business transactions
    and acknowledgements. Optionally used to manage your B2B inbox and outbox. It remains part of the B2B e-Hub
    services.
- term: B2B Browser Application
  definition: An application supplied by AEMO for participants to manage their MSATS B2B Handler inbox and outbox,
    and support the creation of a specified set of B2B Transactions.
- term: B2B Contacts List
  definition: A list of contact details published by participants used for the purpose of contact between participants
    to support B2B communications according to the B2B Procedures.
- term: B2B Delivery Method
  definition: Either API or FTP
- term: B2B e-Hub
  definition: An electronic information exchange platform facilitating B2B Communications.
- term: B2B e-Hub Acknowledgement
  definition: 'A message acknowledgement generated by the B2B e-Hub Handler, see B2B Procedures: Technical Delivery
    Specification.'
- term: B2B e-Hub Batch Handlers
  definition: 'An extension of the MSATS batch handler managing the B2B Communications between participant ID folders
    and AEMO. For details, see B2B Procedures: Technical Delivery Specification.'
- term: B2B e-Hub Handler Inbox
  definition: 'The file directory where participants publish B2B messages and acknowledgements for other participants,
    see B2B Procedures: Technical Delivery Specification.'
- term: B2B e-Hub Handler Outbox
  definition: 'The file directory where participants receive B2B messages and acknowledgements from other participants,
    see B2B Procedures: Technical Delivery Specification.'
- term: B2B e-Hub Services
  definition: 'AEMO provides the following pre-production and production environment e-Hub services: 1. The MSATS
    Browser functionality accessible over MarketNet. 2. The FTP Gateway accessible over MarketNet (to support the
    B2B hokey-pokey protocol). 3. The e-Hub Portal functionality accessible over MarketNet or the internet. 4. The
    e-Hub API functionality accessible over internet or MarketNet. Either to push the messages or pull the message
    from the e-Hub queue using RESTful APIs.'
- term: B2B File
  definition: See B2B message
- term: B2B Infrastructure
  definition: See National B2B infrastructure.
- term: B2B Initiator
  definition: The participant who initiates a B2B interaction.
- term: B2B Interaction
  definition: 'A complete set of related exchanges of B2B messages between two participants involving: Business
    Document, Business Receipt, Business Acceptance/Rejection.'
- term: B2B interfaces
  definition: 'AEMO provides the following pre-production and production environment interfaces: 1. The MSATS Browser
    functionality accessible over MarketNet. 2. The FTP Gateway accessible over MarketNet (to support the B2B hokey-pokey
    protocol). 3. The e-Hub Portal functionality accessible over MarketNet or the internet. 4. The e-Hub API functionality
    accessible over internet or MarketNet. Either to push the messages or pull the message from the e-Hub queue
    using RESTful APIs.'
- term: B2B Mapping to aseXML
  definition: A document detailing the specific aseXML interfaces used in the implementation of B2B transactions.
- term: B2B Message
  definition: A B2B transaction or acknowledgement sent between a B2B initiator and a B2B recipient.
- term: B2B Notification
  definition: A B2B Transaction not having a corresponding reply.
- term: B2B Procedures
  definition: The documents that comprise the B2B Procedures prescribing the content of, the processes for, and
    the information to be provided to support B2B communication.
- term: B2B Process
  definition: 'A defined business process of which a B2B interaction is a key component. Examples of B2B processes
    are: Service Orders, Customer & Site Details, Meter Data Request, and One Way Notification.'
- term: B2B Protocol
  definition: Either the FTP or API delivery method
- term: B2B Recipient
  definition: The receiving participant of a B2B transaction or acknowledgement (sent by a B2B initiator). As a
    convention, the initiator of a B2B interaction is the participant who sends the business document.
- term: B2B Responder
  definition: Using the Responder, participants with appropriate access rights can specify the standard transactions
    they would like to receive. Participants can also search and track the flow of messages between the Responder
    and themselves.
- term: B2B Standard
  definition: A collection of B2B procedures and supporting documentation that collectively form a coherent set
    of requirements (an industry B2B Standard). The components of a B2B standard are described by the B2B Standards
    Framework.
- term: B2B Standards Framework
  definition: Describes the components of a B2B standard.
- term: B2B Transaction
  definition: An aseXML realisation of a Business Document.
- term: B2B Transaction Types
  definition: 'The transactions defined in the B2B Procedures. See B2B Procedures: Technical Delivery Specification.'
- term: B2M
  definition: Business-to-Market
- term: Backhaul
  definition: See Relevant Rules or Procedures
- term: Backhaul delivery point
  definition: See Relevant Rules or Procedures
- term: Backhaul pipeline segment
  definition: See Relevant Rules or Procedures
- term: Backhaul receipt point
  definition: See Relevant Rules or Procedures
- term: Backhaul services
  definition: See Relevant Rules or Procedures
- term: Backup RoLR
  definition: As defined in the AER RoLR Guidelines.
- term: Band Availability
  definition: The band availability for the period corresponding to the Price Band for the matching Period.
- term: Base load
  definition: Generating units that typically run at all times throughout the year except during maintenance outages.
    Coal-fired generating units are a typical example of base load generating unit.
- term: Baseline Energy
  definition: Unadjusted baseline energy + additive adjustment
- term: Baseline Proponent
  definition: A Market Participant who submits an application, in accordance with section 4.1 of these Guidelines,
    for a new baseline methodology to be developed.
- term: Baseline window
  definition: 45 calendar days. This time range is long enough to allow for a significant number of qualifying days
    but not so long as to create serious distortions due to changing seasons.
- term: Basic Meter
  definition: A device complying with Australian Standards, containing a measurement element(s) and a record of
    the accumulated quantity of the electricity flowing through the power conductor. Also known as an accumulation
    meter.
- term: Basic Meter Profile
  definition: A party that applies a profile shape to a Basic Meter read to produce calculated interval data.
- term: Batch
  definition: A right type assigned to a participant user by their participant administrator to access a Batch (file)
    application
- term: Batch Entity Table
  definition: The table that allows execute access to batch commands to be assigned to a user right.
- term: Batch Handler Transactions
  definition: Communication between participant ID folders and AEMO. Each participant ID set of folders has at least
    two subfolders, \import and \export, with naming relative to the participant ID.
- term: Batch Handlers
  definition: Allows communications between AEMO's systems and participant systems. When communications are processed
    using the Batch Handlers, they undergo the same validity checks as if they were processed using the web portal.
- term: Batcher
  definition: An application providing an interface for batch transactions, called MSATS Participant Batcher.
- term: BCT
  definition: Bulk Change Tool
- term: BDU
  definition: Bi-directional Unit. A bi-directional unit capable of charge and discharge; for example, battery technologies.
- term: BESS
  definition: Battery Energy Storage System
- term: Bid
  definition: See Relevant Rules or Procedures
- term: Bid and Offer Validation Data
  definition: See Relevant Rules or Procedures
- term: Bid File
  definition: See Relevant Rules or Procedures
- term: Bid profile
  definition: A single bid submission that includes all bids for each gas day.
- term: Bid Sheet
  definition: The grid where you enter or view Bid/Offer details.
- term: Bid/Offer
  definition: 'The term Bid relates to the following Dispatch Bids: Energy (Scheduled Loads or Wholesale Demand
    Response Units). The term Offer relates to the following Dispatch Offers: 1. Energy (Generation Dispatch Offer)
    2. Frequency Control Ancillary Service (FCAS) 3. Market Network Service Provider (MNSP - Network Dispatch Offer)'
- term: Bid/Offer Cut-off Time
  definition: 12:30 pm on the day before Trading Day of the Dispatch Offer
- term: Bid/Offer File
  definition: The JSON file submitted to AEMO's market systems for a Dispatch Offer or Bid.
- term: Bid/Offer Type
  definition: Daily or Rebid
- term: Billing run type
  definition: 'There are two billing run types: Final and Revision.'
- term: Blind Update Tool
  definition: Allows participants to submit a csv formatted payload containing data for new CATS Standing Data fields
    requiring a value A limited subset of CATS CR validations is applied to a BUT Submission The History Model is
    not updated so not suitable for Settlement or Compliance Standing Data
- term: BM
  definition: Baseline Methodology
- term: BM Register
  definition: The register of BMs and baseline settings published by AEMO in accordance with NER 3.10.3(d)
- term: BMP
  definition: 'Basic Meter Profile: The application of profile shape data to accumulated metering data to create
    half-hourly interval metering data for a Profile Area. Records the total amount of energy consumed at a connection
    point from the initial energisation of the meter.'
- term: BMRG
  definition: Business-to-Business and Market Settlement and Transfer Solutions Reference Group. Established to
    provide advice to the Information Exchange Committee (IEC) on the issues and opportunities relating to the B2B
    framework and its procedures, and to develop changes to these where necessary on behalf of the IEC.
- term: BOM
  definition: Bureau of Meteorology. Executive agency of the Australian government responsible for providing weather
    services to Australia and surrounding areas. Strategic partnership with AEMO for forecasting since 2018.
- term: BPQD
  definition: Basic Power Quality Data. A subset of power quality data consisting of voltage, current, and phase
    angle
- term: Bulk Change Tool
  definition: A component of MSATS used by AEMO to make bulk changes to data without requiring the submission of
    Change Requests. The History Model is updated so suitable for Settlement or Compliance Standing Data
- term: Bundling
  definition: A function in MSATS where AEMO bundles MSATS Change Request Notifications. This means that instead
    of sending Change Request notifications as individual XML messages containing a single transaction, many can
    be bundled into a single XML message (one message, with multiple transactions, in a single file).
- term: Business
  definition: As defined in the NERL.
- term: Business Acceptance
  definition: A specific instance of a business acceptance/rejection business signal indicating acceptance.
- term: Business Acceptance/Rejection
  definition: A business signal indicating whether a business document is accepted or rejected based on the application
    of business rules. See each B2B procedure for further details regarding the use of this transaction.
- term: Business Day
  definition: See Relevant Rules or Procedures
- term: Business Document
  definition: 'Notifications, Requests, or Responses between participants, containing relevant business information
    for the following transactions:  MeterDataNotification  ProvideMeterDataRequest  VerifyMeterDataRequest 
    ServiceOrderRequest  ServiceOrderResponse  CustomerDetailsNotification  CustomerDetailsRequest  SiteAccessNotification
     OneWayNotification  PlannedInteruptionNotification  MeterFaultandIssueNotification  NoticeOfMeteringWorksTransaction
     NotifiedPartyTransaction'
- term: Business Event
  definition: The reason for the acceptance or rejection of a B2B Transaction.
- term: Business function
  definition: A logical grouping of related business services or sub-services for exchanging information between
    participants and AEMO on IDX.
- term: Business function resource
  definition: A sub-service within an IDX business function typically associated with B2B and B2M transactions
- term: Business Group
  definition: A group of participant companies (each with their own Participant IDs) that are part of a single commercial
    enterprise.
- term: Business Hour
  definition: A period of one hour within a business day.
- term: Business Hours
  definition: Normal operating hours for a participant.
- term: Business Receipt
  definition: A business signal indicating a business document has been received and its contents indicates if it
    is readable by the recipient.
- term: Business Rejection
  definition: Specific instance of a Business Acceptance/Rejection business signal indicating a rejection.
- term: Business Signal
  definition: An acknowledgement generated by a B2B recipient on processing a business document to indicate whether
    the business document is received and is readable (this business signal is called a business receipt) or it
    does or does not pass business rule validation (this business signal is called a business acceptance/rejection).
- term: BUT
  definition: Blind Update Tool
- term: C4 Report
  definition: An MSATS report that containing current CATS Standing Data for one or more NMIs.
- term: Cancel
  definition: A ServiceOrderStatus indicating the Service Order is cancelled.
- term: Cancelled
  definition: A status of a Change Request.
- term: Cancelled Units
  definition: See Relevant Rules or Procedures
- term: Capacity
  definition: PASA Availability, as described in clause 3.7.2(d)(1) of the National Electricity Rules and the NER
    glossary.
- term: Capacity Product
  definition: Capacity on pipeline or compressor infrastructure.
- term: Cash Security
  definition: See Relevant Rules or Procedures
- term: Category
  definition: Generating units modelled in the EAAP are categorised into Baseload, Intermediate or Peaking generation
    groups.
- term: Category A
  definition: A category of MP accredited to install whole current meters of a manually read metering installation
    only.
- term: Category B
  definition: A category of MP accredited to provide, install, and maintain a metering installation.
- term: Category C
  definition: A category of MDP accredited to collect metering data from manually read metering installations only.
- term: Category D
  definition: A category of MDP accredited to provide metering data services related to the collection, processing,
    storing, and delivery of metering data.
- term: CATS
  definition: Customer Administration and Transfer Solution. A set of procedures, principles and obligations made
    under the National Electricity Rules as part of Market Settlement and Transfer Solutions (MSATS), and applicable
    to NMI (National Metering Identifier) small and large classifications.
- term: CATS History Model
  definition: See Technical Guide to MSATS
- term: CATS Participant
  definition: 'As defined in the MSATS Procedures: CATS Procedures. Any organisation that has a defined role in
    the MSATS system, see role.'
- term: CATS Procedures
  definition: 'MSATS Procedures: CATS Procedure Principles and Obligations'
- term: CATS Standing Data
  definition: 'The data held in the following database tables: • CATS_NMI_Data_Stream • CATS_NMI_Data • CATS_Meter_Register
    • CATS_NMI_Participants_Relationships • CATS_Register_Identifier NMI Standing Data is a sub-set of the CATS
    Standing Data.'
- term: CATS Standing Data Access Rules
  definition: The rules specifying which CATS Standing Data can be accessed, as specified in section 41.5 of the
    CATS Procedures.
- term: CBU
  definition: Contracted but un-nominated capacity
- term: CC
  definition: Capacity Certificate
- term: CCAS
  definition: Capacity Certificate Auction System
- term: CCATP
  definition: Capacity Certificate Auction and Transfer Procedures
- term: CCGT
  definition: Combined Cycle Gas Turbine. Uses both gas and steam turbine cycles in a single plant to produce electricity
    with high conversion efficiencies and low emissions.
- term: CEC
  definition: Clean Energy Council
- term: CGP
  definition: Carpentaria Gas Pipeline. A transmission pipeline system in Queensland.
- term: Change Reason Code
  definition: A code that identifies a type of Change Request. It defines rules such as what NMI information can
    be updated and which roles will receive a Change Request Notification each time the Change Request Status is
    updated.
- term: Change Request
  definition: A transaction submitted by participants in MSATS whenever they want to create or update data held
    in MSATS.
- term: Change Request Notification
  definition: A notification generated by MSATS and provided to one or more participants as a consequence of a change
    of status of a Change Request.
- term: Change Request Status
  definition: 'The nominated status in the Change Request life cycle. Can be one of the following statuses: Requested,
    Pending, Completed, Objected, Cancelled, or Pending Validation.'
- term: Change Request Status Notification Rules
  definition: Rules that specify which roles are advised when a Change Request undergoes a change in status, as
    described in the CATS Procedures for each Change Reason Code.
- term: Checksum
  definition: See NMI checksum.
- term: Child Name
  definition: The Embedded Network Code populated in the EmbNetChild field in MSATS for a Child NMI to indicate
    that the NMI is a child for a specified embedded network.
- term: Child NMI
  definition: The NMI assigned to a child connection point.
- term: CIR
  definition: Congestion Information Resource. A consolidated source of information relevant to the understanding
    and management of transmission network congestion (constraint) risk.
- term: Clearing Account
  definition: See Relevant Rules or Procedures
- term: Clearing parties
  definition: Financially responsible to the clearing house for transactions made by its Traders
- term: Close of Business
  definition: 5.00 PM at the location of the site on a business day.
- term: CLP
  definition: Controlled Load Profile. A profile applied to the controlled load basic meter readings to convert
    them into energy consumption for each 30-minute trading interval for settlement purposes.
- term: Cluster
  definition: A cluster is a group of intermittent generating units; there may be more than one cluster in a Unit.
    AEMO may agree to have non-identical turbines in a cluster in exceptional circumstances.
- term: CND
  definition: CATS NMI Data
- term: COAG
  definition: Council of Australian Governments. The peak intergovernmental forum in Australia.
- term: Combinatorial Bid
  definition: A bid with multiple Products.
- term: Completed
  definition: One of the status points of a Change Request.
- term: Compression Delivery point
  definition: See Relevant Rules or Procedures
- term: Compression Delivery Zone
  definition: See Relevant Rules or Procedures
- term: Compression Receipt Point
  definition: See Relevant Rules or Procedures
- term: Compression Service Facility
  definition: See Relevant Rules or Procedures
- term: Compression Services
  definition: See Relevant Rules or Procedures
- term: Confidential Information
  definition: See Relevant Rules or Procedures
- term: Connection Date
  definition: 'The date the connection point is connected to the electricity network, see B2B Procedure: Service
    Order Process.'
- term: Constraint
  definition: See Relevant Rules or Procedures
- term: Consumer
  definition: An end use customer of energy.
- term: Consumption
  definition: The electricity used over a period of time
- term: Contact
  definition: External and internal business contacts, similar in functionality to an address book. A contact may
    be an internal contact within the participant organisation, or could be an external contact belonging to another
    market participant.
- term: Contestable
  definition: Relates to transmission services or distribution services; a service permitted by the laws of the
    relevant participating jurisdiction to be provided by more than one service provider as a contestable service
    or on a competitive basis.
- term: Contingency Services
  definition: Refers to one or all of (1) the fast raise service; (2) the fast lower service; (3) the slow raise
    service; (4) the slow lower service; (5) the delayed raise service; and (6) the delayed lower service
- term: Contract Preferences
  definition: Shippers preferences for contracts or agreements they want to trade against.
- term: Contract Reference
  definition: A reference number to a contract or agreement held by the Shipper and the Facility Operator to trade
    capacity on a facility. This is a collective term that includes the Service Provider Reference, DWGM Reference,
    and STTM Customer Registration Number.
- term: Contract Reference Selection
  definition: The Contract References selected by the participant for netting.
- term: Contractual arrangement
  definition: The contractual arrangement between the two parties that underlies the reallocation transaction.
- term: Controlled Load
  definition: Load controlled by the metering installation (e.g. frequency injection relay or time clock) and may
    be separately metered from the remaining load at a metering point. The majority of Controlled Loads are associated
    with off-peak hot water, pool pumps, and air-conditioning units.
- term: Controlled Unmetered Device
  definition: An Unmetered Device that has a predictable load and is switched in accordance with an On/Off Table
    (e.g. street lighting).
- term: ControlNet
  definition: AEMO's SCADA system
- term: Cooling-off Period
  definition: 'In the NEM (except Victoria): as defined in the NERR. In Victoria: As defined in the Energy Retail
    Code published by the Essential Services Commission of Victoria.'
- term: Counterparty
  definition: The authoriser of the Reallocation
- term: CPT
  definition: The extension of a corrupt acknowledgement file.
- term: CR
  definition: Change Request
- term: Create Privilege
  definition: Provides the participant user the access right to create records represented by an entity.
- term: Credit participant
  definition: The market participant credited with the reallocation amount for a reallocation, as part of settlement
    for the relevant billing period.
- term: Credit Participant ID
  definition: The participant who receives a credit settlement transaction in their settlement statement for any
    Cap, Dollar, Energy and Floor Reallocation Transactions that have a positive value and when the Spot Price is
    greater than the Strike Price for a Swap Reallocation
- term: Credit Party
  definition: The participant who receives a credit Reallocation
- term: Credit Reference
  definition: Freeform text supplied by the Credit Participant
- term: Credit Support
  definition: See Relevant Rules or Procedures
- term: CRMP
  definition: Cost Recovery Market Participants. CRMPs are Market Generators, Market Customers and IRPs
- term: CRN
  definition: Customer Registration Number
- term: CRUD
  definition: Create, read, update, and delete access rights.
- term: CSR
  definition: Certificate Signing Request is a block of encoded text given to a Certificate Authority when applying
    for an SSL Certificate. It also contains the Public Key to include in the certificate. Usually, a Private Key
    is created at the same time, making a Key Pair.
- term: csv
  definition: Comma Separated Values. A file format for data using commas as delimiters.
- term: csv payload
  definition: Payload
- term: CSVNotificationDetail
  definition: A defined data payload applicable only for some transactions in the One Way Notification Procedure.
- term: CT
  definition: Current transformer
- term: CTP
  definition: Capacity trading platform. An online platform that shippers can use to trade secondary pipeline capacity
    ahead of the nomination cut-off time.
- term: Cumulative Price Threshold
  definition: See Relevant Rules or Procedures
- term: Curl
  definition: A command line utility used to interact with REST API endpoints.
- term: Current
  definition: The participant can receive files compliant to the current aseXML version.
- term: Current FRMP
  definition: As defined in the MSATS Procedures, CATS Procedures. The retailer identified on the current NMI master
    record.
- term: Current LNSP
  definition: As defined in the MSATS Procedures, CATS Procedures. The LNSP identified on the current NMI master
    record.
- term: Current MDP
  definition: As defined in the MSATS Procedures, CATS Procedures. The MDP identified on the current NMI master
    record.
- term: Current Party
  definition: The entity associated with the meter installation and retail arrangements of a consumer.
- term: Current Retailer
  definition: See current FRMP
- term: Current RP
  definition: As defined in the MSATS Procedures, CATS Procedures. The RP identified on the current NMI master record.
- term: Customer and Site Details
  definition: 'The elements of data identified in any of the notification transactions detailed in the B2B Procedures:
    Customer and Site Details Notification Process. See B2B Procedures: Customer and Site Details Notification Process.'
- term: Customer and Site Details Changes
  definition: 'Includes new, amended, additional, or removal of one or more elements of data identified in any of
    the notification transactions detailed in the B2B Procedures: Customer and Site Details Notification Process.
    See B2B Procedures: Customer and Site Details Notification Process.'
- term: Customer Classification Code
  definition: A code used to determine the classification of an retail customer. For more information, see the CATS
    Procedures.
- term: Customer Details
  definition: 'The elements of data identified in the customer details notification transaction detailed in the
    B2B Procedures: Customer and Site Details Notification Process. See B2B Procedures: Customer and Site Details
    Notification Process.'
- term: Customer Details Changes
  definition: 'Includes new, amended, additional, or removal of one or more elements of data identified in any of
    the customer details notification transactions detailed in the B2B Procedures: Customer and Site Details Notification
    Process. See B2B Procedures: Customer and Site Details Notification Process'
- term: Customer Threshold Code
  definition: A code used in MSATS to determine the consumption for an End User at a single connection point. for
    more information, see section the CATS Procedures.
- term: CVP
  definition: Constraint Violation Penalties
- term: D-n
  definition: See Relevant Rules or Procedures
- term: DAA
  definition: Day Ahead Auction. An auction of contracted but un-nominated capacity in Pipeline Capacity Trading
    (PCT). It is conducted after nomination cut-off and is subject to a reserve price of zero.
- term: Daily Bid/Offer
  definition: Offer Type submitted before the Offer Cut-off Time (12:30 PM the day before the Trading Day
- term: Data Delivery Calendar
  definition: Lists the dates specified actions need to occur for the provision of metering data and settlements
    ready data to AEMO.
- term: Data Interchange
  definition: A set of cooperating applications used to replicate data between AEMO's energy market systems and
    a participant's DBMS conforming to the MMS Data Model.
- term: Data Interchange (DI)
  definition: Data Interchange
- term: Data Model
  definition: The definition of the interface to participants of data published by AEMO for gas or electricity.
    A database conforming to the Data Model can contain a local copy of all current participant-specific data recorded
    in the main database. The Data Model includes database tables, indexes, and primary keys.
- term: Data Request
  definition: A transaction initiated by MSATS and sent to a participant at the Pending Validation status of the
    Change Request life cycle.
- term: Data sharing
  definition: Each participant ID can share their data with other participant IDs, subject to an authorised request.
    Implementing data sharing means the full Data Interchange data set (including private data) for the requesting
    participant ID is made available to another participant's sets of folders in the EMMS file server, as nominated
    in the request. The sharing of data is for both pre-production and production. A data sharing requirement may
    emerge, for example, due to a merger with, takeover of, or sale of another registered participant. The requirement
    may be to use one company's IT system to manage access, and process the data for two or more participant IDs
    using just one participant IDs set of folders in the EMMS file server. The Data Interchange web application
    in the Markets Portal provides the status of any data sharing agreements you have implemented.
- term: Data Stream
  definition: A stream of metering data associated with a connection point, as represented by a NMI. A NMI can have
    multiple data streams (e.g. from one or more meters, or from one or more channels or registers that comprise
    a single meter). Each data stream is identified by a unique suffix associated with the NMI.
- term: Data stream Status Code
  definition: A code used in MSATS to indicate whether a Data stream is used in settlements. For more details, see
    the CATS Procedures.
- term: Data Subscription
  definition: A web application in the Markets Portal used to subscribe to Data Interchange files and to obtain
    the latest MMS Data Model. These files are typically csv files containing public data and participant’s private
    data. AEMO recommends participant use of the Data Interchange suite of products, supplied by AEMO, to automate
    receiving and storage of the files to their systems. AEMO provides working sample software for FTP access (Participant
    Batcher) to MarketNet and working sample software for Data Interchange.
- term: DB
  definition: Distribution Business. In the energy sector, these refer to businesses that convert high-voltage electricity
    back to a low voltage for distribution via the infrastructure of poles and wires.
- term: DBMS
  definition: Database Management System
- term: De-energised Site
  definition: 'A connection point that is not electrically connected to the network. See B2B Procedures: Service
    Order Process.'
- term: Debit participant
  definition: The market participant debited with the reallocation amount for a reallocation, as part of settlement
    for the relevant billing period.
- term: Debit Participant ID
  definition: The participant who receives a debit settlement transaction in their settlement statement for any
    Cap, Dollar, Energy and Floor Reallocations that have a positive value and when the Spot Price is greater than
    the Strike Price for a Swap Reallocation
- term: Debit Party
  definition: The participant who receives a debit Reallocation
- term: Debit Reference
  definition: Freeform text supplied by the Debit Participant
- term: DEC
  definition: Daily Energy Constraint
- term: Default and Deregistration Procedure
  definition: Procedure for Metering Providers, Metering Data Providers, Embedded Network Managers and Metering
    Coordinators.
- term: Delete Privilege
  definition: Provides the participant user the access right to delete records represented by an entity.
- term: Delivery Method
  definition: Either the API or FTP protocol
- term: Delivery Netting
  definition: See Relevant Rules or Procedures
- term: Delivery Period
  definition: See Relevant Rules or Procedures
- term: Delivery point
  definition: See Relevant Rules or Procedures
- term: Delivery transaction type
  definition: A transaction record representing a participant’s obligation to deliver or receipt gas. Delivery transactions
    are generated on import from the ETS where the transaction is in a product that is not netted for delivery or
    by the Delivery Netting Module if the transaction is associated with a delivery netting product.
- term: Delivery Zone
  definition: See Relevant Rules or Procedures
- term: Demand
  definition: The amount of power consumed at any time
- term: Demand Response
  definition: Demand response is a physical response at a site to the price.
- term: DER
  definition: Distributed Energy Resources. Distribution level resources which produce electricity or actively manage
    consumer demand (examples include solar rooftop PV systems and batteries, and demand response via hot water
    systems, pool pumps, smart appliances and air conditioning control).
- term: DERR
  definition: DER Register
- term: DFS
  definition: Demand Forecasting System
- term: Directional Interconnector
  definition: See Relevant Rules or Procedures
- term: Disconnecting officer
  definition: 'The service provider''s personnel performing a de-energisation service order. Refer B2B Procedures:
    Service Order Process.'
- term: Discontinued Report
  definition: When a Legacy version of a file replaces an existing Legacy file, some versions of the included reports
    may change. The replaced report versions are referred to as discontinued. Participants on Discontinued versions
    may be impacted if a report is discontinued in a Legacy file they are receiving.
- term: Discontinued version
  definition: Refers to the tables, files, and reports deployed two versions ago. AEMO only supports the current
    and previous Data Model versions.
- term: Dispatch
  definition: See National Electricity Rules
- term: Dispatch Bid
  definition: See National Electricity Rules
- term: Dispatch Bids and Offers File
  definition: The JSON schema used to provide Dispatch Bids and Offers into the NEM.
- term: Dispatch Inflexibility Profile
  definition: See Relevant Rules or Procedures
- term: Dispatch Instruction
  definition: See Relevant Rules or Procedures
- term: Dispatch Interval
  definition: See Relevant Rules or Procedures
- term: Dispatch Interval (DI)
  definition: Dispatch Interval. A trading period of time for which the electricity price is set in the market.
- term: Dispatch Level
  definition: See Relevant Rules or Procedures
- term: Dispatch Offers
  definition: See Relevant Rules or Procedures
- term: Dispatchable Unit
  definition: See Relevant Rules or Procedures
- term: Dispatchable Unit Identifier
  definition: See Relevant Rules or Procedures
- term: Distribution Networks
  definition: See National Electricity Rules
- term: Distributor
  definition: The term DNSP is used in favour of Distributor in the B2B Procedures.
- term: DLF
  definition: Distribution Loss Factor. The loss of energy, due to electrical resistance and the heating of conductors,
    as electricity flows through the transmission and distribution networks.
- term: DLF Code
  definition: A code used in MSATS to identify a distribution loss factor.
- term: DMS
  definition: Dispute Management System. A system designed to manage the resolution of disputes, and a requirement
    for AEMO and all registered participants.
- term: DNSP
  definition: Distribution Network Service Provider. A business that owns, operates or controls an electricity distribution
    network.
- term: DPID
  definition: Delivery point identifier. An Australia Post assigned identifier that is a numeric descriptor for
    a postal delivery point equal to a physical address.
- term: DPV
  definition: Distributed Photovoltaics or Distributed PV
- term: DRSP
  definition: Demand Response Service Provider
- term: DS
  definition: Dispatch
- term: DSP
  definition: Demand Side Participation
- term: DSPIP
  definition: Demand Side Participation Information Portal
- term: DTS
  definition: Declared Transmission System (Victoria). Victoria’s gas transmission system, operated by AEMO.
- term: Dual MLF
  definition: Dual Marginal Loss Factor, interchangeably used with Dual TLF (transmission loss factor) called Primary
    and Secondary MLF.
- term: DUFG
  definition: Distribution Unaccounted For Gas. Business rules and data formats which enables the exchange of required
    information between distributors and market participants.
- term: DUID
  definition: Dispatchable Unit Identifier
- term: DUOS
  definition: Distribution Use of System Charge. Charge levied by distribution network businesses to recover operations
    and maintenance costs and investment returns on distribution assets.
- term: DWGM
  definition: Declared Wholesale Gas Market. A Victorian gas market that allows trading on injections and withdrawals
    from the Declared Transmission System (DTS).
- term: DWGM Reference
  definition: AEMO’s reference number to the agreement between a Shipper and Facility Operator for capacity trading
    on the DWGM.
- term: e-Hub
  definition: Consists of the API Portal and the API Gateway for both electricity and gas.
- term: EAAP
  definition: Energy Adequacy Assessment Projection. A quarterly AEMO report of projected energy availability for
    each region over a 24-month period for three different rainfall scenarios.
- term: EAAP engine
  definition: Software used to conduct Monte Carlo simulations.
- term: EAAP system
  definition: The EAAP engine and the GELF Declarations application in the Markets Portal.
- term: ebXML
  definition: Electronic Business XML. An internationally developed set of protocols for using XML. ebXML is a wide
    ranging standard that covers all layers of messaging. The VicGas FRC project has adopted only the transport,
    routing and packaging (TRP) recommendations of ebXML, and is using aseXML to define standards for message content.
- term: ECG
  definition: East Coast Gas
- term: ECM
  definition: Energy Conversion Model for Wind and Solar
- term: EDD
  definition: Effective Degree Day
- term: EDM
  definition: Electricity Data Model
- term: EDP
  definition: Enterprise Data Platform
- term: EENSP
  definition: Exempt Embedded Network Service Provider
- term: Effective Bid/Offer
  definition: The latest Bid/Offer File for a trading day.
- term: Effective Date
  definition: The trading day specified in a Bid/Offer, and any subsequent trading days until superseded by a later
    valid Bid/Offer.
- term: Effective Upper Limit
  definition: Intermittent Generation term
- term: EFP
  definition: Exchange of futures for physical
- term: EFP Trade
  definition: EFP Trade Submission having 1 sell and 1 buy with a matching Gas Future ID
- term: EFP Trade ID
  definition: Gas Future ID
- term: EFP Trade Information
  definition: The information submitted to AEMO in an EFP Trade Submission
- term: EFP Trade Record
  definition: A row or itemList in a Future Transfer Submission
- term: EFP Trade Submission
  definition: Information provided to AEMO by Trading Participants stored in the GSH database for matching and audit
    purposes Can contain many EFP Trade Records
- term: EFP Trading Window
  definition: 'The Submission Period between the Start and End Dates: Start Date: First Gas Day of the Delivery
    Period minus 14 Calendar Days End Date: First Gas Day of the Delivery Period minus 2 Calendar Days'
- term: EGP
  definition: Eastern Gas Pipeline. A pipeline that runs to/from Sydney to Melbourne to supply southern domestic
    demand.
- term: Electric Vehicle
  definition: Residential and business battery powered vehicles, such as motor bikes, cars, and large commercial
    trucks
- term: Electricity Data Model
  definition: The Electricity Data Model is the definition of the interface to participants of data published by
    AEMO from National Electricity Market (NEM) systems.
- term: Elements Unavailable
  definition: Required on a per cluster basis to indicate the number of elements (turbines or inverters) within
    each cluster unavailable for generation (due, for example, to maintenance, turbines not being built, or the
    inability to generate because transmission or distribution networks are unavailable).
- term: Embedded Network Code
  definition: Code to identify an embedded network.
- term: Emissions Trading Scheme (ETS)
  definition: Emissions Trading Scheme. A market-based scheme for environmental improvement that allows parties
    to buy and sell permits for emissions, or credits for reductions in emissions, of certain pollutants.
- term: EMMS
  definition: Energy Market Management System (formerly MMS); software, hardware, network and related processes.
- term: EMS
  definition: Energy Management System. A computer system that gathers real-time telemetered information on the
    network, substations, generators and loads.
- term: EN
  definition: Embedded network. Private electricity networks that serve multiple premises and are located within,
    or connected to, a distribution or transmission system through a parent connection in the National Electricity
    Market.
- term: Endpoint
  definition: Where the API request is sent and where the response comes from.
- term: Energised Site
  definition: 'A connection point that is electrically connected to the network, see B2B Procedures: Service Order
    Process.'
- term: Energy
  definition: 'The unit must be a generator for the service type: ‘energy’. Loads cannot bid for mandatory restrictions
    capacity.'
- term: Energy Constraint
  definition: See Relevant Rules or Procedures
- term: Energy Offer
  definition: The unit must be a generator for the service type, Energy.
- term: Energy Storage Systems
  definition: A small distributed battery storage for residential and commercial consumers
- term: ENLR
  definition: Embedded Network Local Retailer. The designated retailer for small customers seeking connection to
    an embedded network.
- term: ENM
  definition: Embedded Network Manager
- term: Entities
  definition: Entities are the individual components or building blocks that represent individual pieces of functionality.
    The main menu options are examples of individual Entities. Entities can be of type “batch” (submitting change
    requests using the Batch Handlers) or “interactive” (using AEMO’s web portal).
- term: Entity
  definition: The individual components or building blocks of the MSATS system, representing individual pieces of
    functionality. Some examples of entities are the menu options available on the MSATS main menu (ombudsman, role
    assignment, create participant, CATS reports and so on).
- term: EoD
  definition: End of Day (gas). Benchmark price of gas for the previous day as per the National Gas Rules.
- term: EoD LP
  definition: End of Day Linepack. Gas in pipelines, measured at the end of a gas day at 6am. EOD LP is equal to
    the beginning-of-day linepack (BOD LP) for the next gas day.
- term: ERAWA
  definition: Economic Regulation Authority Western Australia. WA’s independent economic regulator.
- term: ERCF
  definition: Electricity Retail Consultative Forum
- term: ERI
  definition: Enhancing Reserve Information. Improves transparency of energy availability across the National Electricity
    Market (NEM) enabling market participants to make more informed decisions about their own behaviour
- term: ESB
  definition: Energy Security Board. Responsible for the implementation of the recommendations from the Independent
    Review into the Future Security of the National Energy Market (the Finkel Review). It also provides whole-of-system
    oversight for energy security and reliability.
- term: ESC
  definition: Energy Savings Certificate
- term: ESOO
  definition: Electricity Statement of Opportunities. AEMO’s 20-year demand forecast and 10-year supply adequacy
    assessment for electricity in the National Electricity Market (NEM); and AEMO’s 10-year demand and supply adequacy
    forecast for the South West interconnected system (SWIS) in Western Australia.
- term: ESS
  definition: Energy Storage Systems
- term: Estimated Reading
  definition: An estimate of a Meter Reading where an Actual Meter Reading for a period in the past is not available.
- term: Estimation
  definition: The forward estimation of metering data.
- term: ETS code
  definition: A unique code that is the same as the trading participant identifier used in the Exchange Trading
    System.
- term: EUR
  definition: Estimated ultimate recovery. An approximation of the quantity of gas that is potentially recoverable
    or has already been recovered from a reserve.
- term: EV
  definition: Electric Vehicle
- term: Event Code
  definition: 'A specific code used to refer to a business event defined in a B2B Procedure, see B2B Procedures:
    Technical Delivery Specification.'
- term: EVM
  definition: B2B Validation Module Software
- term: Ex Ante
  definition: Lodged before the target trading intervals occur, when the volume and price are unknown.
- term: Ex Post
  definition: Lodged after the target trading intervals occurred, where the volume and price are known.
- term: Exchange
  definition: See Relevant Rules or Procedures
- term: Exchange Agreement
  definition: See Relevant Rules or Procedures
- term: Exchange Trading System (ETS)
  definition: GSH Exchange Trading System
- term: Exchange transaction type
  definition: Represents a transaction entered into through the exchange. The record is relevant for financial settlement
    and prudential purposes.
- term: Exemption Guideline
  definition: Exemption Guideline forSmall Customer Metering Installation.
- term: Exemption Procedure
  definition: Exemption Procedure for Metering Installation Malfunctions.
- term: Expiry
  definition: A reallocation request expires if it is not authorised prior to the submission cut-off date applicable
    to the start date of the reallocation request.
- term: Explicit Informed Consent
  definition: In the NEM, apart from Victoria, as defined in the NERL. In Victoria, as defined in the Energy Retail
    Code published by the Essential Services Commission of Victoria.
- term: Facility
  definition: The facility to assist in the selection of the Receipt and/or Delivery Point.
- term: Facility Operator
  definition: See Relevant Rules or Procedures
- term: Failed Retailer
  definition: A retailer that is the subject of a RoLR Event.
- term: FCAS
  definition: Frequency Controlled Ancillary Services. A service that balances, over short intervals (shorter than
    the dispatch interval), the power supplied by generating units and the power consumed by loads.
- term: FCASVT
  definition: FCAS Verification Tool (FCASVT), is an MS Excel based tool used and designed by SPC to assess and
    verify the performance of MASP in delivery of contingency services
- term: FFR
  definition: Fast Frequency Response
- term: Field Validation Rules
  definition: As described in the CATS Procedures, they specify, for each Change Reason Code, the fields in MSATS
    populated at the creation of a transaction or at other times in the life cycle of a transaction.
- term: File Limit
  definition: 'Refers to the number of files in an inbox or outbox at which point the B2B Handler generates a flow
    control file, see B2B Procedures: Technical Delivery Specification.'
- term: File Transfer and Acknowledgement Protocol
  definition: 'See MSATS File Exchange Protocol in the B2B Procedures: Technical Delivery Specification.'
- term: Final EFP Trade Submission
  definition: Information provided to AEMO by Trading Participants during the EFP Trading Window with the Gas Future
    ID and Final Price. Providing the information passes validation, AEMO uses it in Prudential Calculations
- term: Final Reading
  definition: The last Actual Meter Reading taken where an End User vacates an address, changes retailer, all or
    any part of a metering installation is removed, or modified and the modification affects the energy data in
    the metering installation.
- term: Final Statement
  definition: See Relevant Rules or Procedures
- term: First-Tier Controlled Load
  definition: A Controlled Load that is a first-tier load. For the purposes of the Metrology Procedure, a first-tier
    load also includes the electricity purchased at a connection point directly and in its entirety from the Local
    Retailer even if it is not classified.
- term: First Tier Customer
  definition: An end use customer whose energy retailer is the local retailer.
- term: First Tier NMI
  definition: The electricity associated with a first tier NMI (classified as a first tier load) is purchased at
    a connection point directly and in its entirety from the local retailer.
- term: Fixed Dollar Amount ($)
  definition: An agreement type where the values entered for the reallocation transaction are direct dollar amounts
    for each gas day in the period to which the reallocation request relates.
- term: Fixed Load
  definition: Optional MW, not greater than the max. availability
- term: Fixed Quantity Amount (GJ)
  definition: An agreement type where the values entered for the reallocation amount are the product of the applicable
    reference price and the energy reallocation quantity specified.
- term: FO
  definition: Facility operator
- term: Forward exposure
  definition: An organisation’s exposure dollar amount attributable to all forward dated submitted or executed orders
    or both, where the delivery dates are calculated based on submitted orders, executed trades, and reallocations
    where the delivery date is today and in the future (exclusive of GST). This is calculated at the time of each
    prudential run and makes up part of the prudential exposure.
- term: Forward Haul Service
  definition: See Relevant Rules or Procedures
- term: FOS
  definition: Frequency Operating Standards
- term: FPP
  definition: Frequency Performance Payments
- term: FRC
  definition: Full Retail Contestability. The gas and electricity markets in which customers are free to select
    their energy retailer.
- term: Frequency
  definition: See Relevant Rules or Procedures
- term: Frequency Dead-Band
  definition: The range of Local Frequency through which a Variable Controller will not operate
- term: Frequency Deviation Setting(s)
  definition: Settings allocated to the Ancillary Service Facility by AEMO within the range.
- term: Frequency Disturbance
  definition: An occasion when the frequency of the power system moves outside the normal operating frequency band
- term: Frequency Disturbance Time
  definition: The time at which Local Frequency falls or rises outside the normal operating frequency band during
    a Frequency Disturbance, referenced to Australian Eastern Standard Time
- term: Frequency Ramp Rate
  definition: Means 0.125 hertz (Hz) per second for regions other than Tasmania or 0.4 Hz per second for the Tasmanian
    region
- term: Frequency Recovery
  definition: Tthe first change in Local Frequency from above 50.15 Hz to below 50.1 Hz, or below 49.85 Hz to above
    49.9 Hz, to occur after a Frequency Disturbance
- term: FRMP
  definition: Financially Responsible Market Participant, usually a retailer, Generator, Market Customer or a Market
    Small Generator Aggregator, identified in respect of a connection point. Responsible for dealings with AEMO
    in relation to a specific load.
- term: FS Min Load
  definition: Fast start unit minimum load (MW). Only relevant to Service type, Energy. For a Wholesale Demand Response
    Unit (WDRU), this is the minimum demand response level.
- term: FSML
  definition: Fast start minimum load
- term: FTP
  definition: File transfer protocol
- term: FTP Gateway
  definition: AEMO systems to participant systems interaction using batch processing, suitable for Participant systems
    using database technology and submission or receipt of high volumes of data. o Management of security and data
    distribution. AEMO recommends this method to replicate large amounts of data
- term: FTP Protocol
  definition: An AEMO delivery method.
- term: Fully Tagged aseXML Transactions
  definition: 'An aseXML transaction not containing a CSV payload, see B2B Procedures: Technical Delivery Specification.'
- term: FUM
  definition: Forecast Uncertainty Measure
- term: Gas Day
  definition: See Relevant Rules or Procedures
- term: Gas Future
  definition: Wallumbilla Gas Future
- term: Gas Future ID
  definition: The ASX provided trade identifier required for a Final Transfer Trade
- term: Gas Supply Hub
  definition: Gas Trading Exchange
- term: Gas Trading Exchange
  definition: See National Gas Rules Part 22
- term: GBB
  definition: Gas Bulletin Board. Provides gas market and system information covering all major gas production fields,
    major demand centres and natural gas transmission pipelines in New South Wales, the Australian Capital Territory,
    Queensland, South Australia, Victoria and Tasmania.
- term: GD
  definition: Gas Day
- term: GELF
  definition: Generator Energy Limitation Framework. A description of the energy constraints that affect the ability
    of a scheduled generating unit to generate electricity prepared in accordance with the Energy Adequacy Assessment
    Projection (EAAP) guidelines.
- term: GELF declarations
  definition: GELF parameters submitted via the EMMS Web Portal by scheduled generators.
- term: GELF parameters
  definition: Parameters of the Generator Energy Limitation Framework (GELF).
- term: GELF reservoir
  definition: Water storages used in the EAAP models to represent hydro power schemes. A component of static GELF
    parameters, see “Static GELF parameters”.
- term: GELF station
  definition: A collection of physical generating units of the same related capacity. A component of static GELF
    parameters, see “Static GELF parameters”.
- term: Generators
  definition: See Relevant Rules or Procedures
- term: GFRC
  definition: Gas Full Retail Contestability
- term: GGAS
  definition: Greenhouse Gas Abatement Scheme. The first mandatory trading scheme aiming to lower greenhouse gas
    emissions in New South Wales.
- term: GJ
  definition: 'Gigajoule: a unit of measure of energy equal to 10 to the power 9 joules.'
- term: GLNG
  definition: Gladstone LNG. A liquefied natural gas plant in Queensland.
- term: Good Industry Practice
  definition: In relation to any undertaking and any circumstances, the exercise of that degree of skill, diligence,
    prudence, and foresight that would reasonably and ordinarily be expected from a skilled and experienced operator
    engaged in the same type of undertaking under the same or similar circumstances.
- term: GPG
  definition: Gas Powered Generation. Electricity generation or generator powered by gas.
- term: GRCF
  definition: Gas Retail Consultative Forum. A monthly forum for consultation between AEMO and stakeholders on the
    development of the retail gas markets operating in New South Wales, the Australian Capital Territory, Queensland,
    South Australia, Victoria and Western Australia.
- term: GRMBS
  definition: Gas Retail Market Business System
- term: GSH
  definition: Gas Supply Hub. An exchange for the wholesale trading of natural gas.
- term: GSH Buyer
  definition: The trading participant submitting bids using the Exchange Trading System.
- term: GSH Counterparty
  definition: The party paired with the participant for gas delivery and receipt. The counterparty receives a notification
    requesting confirmation when a delivered quantity record is submitted.
- term: GSH Market Participant
  definition: Refers to both trading participants and reallocators.
- term: GSH Order
  definition: A bid or offer.
- term: GSH Organisation
  definition: A member of exchange holding bank guarantees against which prudential exposure is determined. An organisation
    has associated trading participants in the GSH, or associated reallocation participants, and incurs settlement
    liabilities or credits or both.
- term: GSH Reallocation Letter of Agreement
  definition: An executed agreement between a market participant and AEMO, allowing use of the GSH Reallocations
    web application to facilitate reallocation transactions. Persons registering as reallocators complete the Letter
    of Agreement during registration. Trading participants wanting to use reallocations can find the GSH Reallocation
    Letter of Agreement on AEMO's website.
- term: GSH Seller
  definition: Trading participant submitting offers using the Exchange Trading System.
- term: GSHRG
  definition: Gas Supply Hub Reference Group
- term: GSI
  definition: Gas Services Information. A suite of regulatory instruments to improve security and transparency of
    information in Western Australia. They establish the Western Australia Gas Bulletin Board (WA GBB) and Western
    Australia Gas Statement of Opportunities WA GSOO).
- term: GSOO
  definition: Gas Statement of Opportunities. AEMO’s 20-year forecast of gas demand and supply adequacy in eastern
    and south-eastern Australia; and AEMO’s 10-year forecast of gas demand and supply adequacy in Western Australia’s
    domestic market.
- term: GU
  definition: Generating Unit
- term: GWCF
  definition: Gas Wholesale Consultative Forum. Enables collaboration between AEMO, the Australian Energy Market
    Commission, the Australian Energy Regulator, relevant jurisdictional bodies, industry participants, and other
    interested parties on the development and implementation of changes to AEMO’s east coast wholesale gas markets
    and related market systems.
- term: GWh
  definition: Gigawatt hours
- term: Hazard
  definition: 'A health and/or safety risk at a site, see B2B Procedures: Customer and Site Details Notification
    Process and B2B Procedures: Service Orders Process.'
- term: Header Parameters
  definition: Parameters included in the request header.
- term: Heating value
  definition: The amount of heat released through burning a quantity of supplied gas
- term: Historical Data
  definition: Metering data provided for a previous reading period.
- term: HLIA
  definition: High-level Impact Assessment
- term: Hokey-Pokey Protocol
  definition: The MSATS FTP Protocol
- term: Host Retailer
  definition: See local retailer
- term: HTTPS
  definition: Hypertext Transfer Protocol Secure, adds the security capabilities of SSL to standard HTTP communications.
- term: HV
  definition: High voltage
- term: HV CT
  definition: High voltage current transformer
- term: IBR
  definition: Inverter-based resources, typically solar, wind and batteries
- term: IDX
  definition: Industry Data Exchange
- term: IESS
  definition: Integrating Energy Storage Systems
- term: IGCC
  definition: Integrated Gasification Combined Cycle. A technology that uses a high-pressure gasifier to turn coal
    and other carbon-based fuels into pressurised gas, known as synthesis gas or syngas. It can then remove impurities
    from the syngas prior to the power generation cycle.
- term: ILAC
  definition: International Laboratory Accreditation Cooperation
- term: Include Superseded
  definition: Bids or Offers superseded by a subsequent bid
- term: Initial Value
  definition: The Generation Amount or Load Amount just prior to the Frequency Disturbance Time of a Frequency Disturbance
- term: Initiate
  definition: The first of the status points of a Change Request.
- term: Initiating Message
  definition: 'The first message in a series of related messages, see B2B Procedures: Technical Delivery Specification.'
- term: Initiation Rules
  definition: As described in the CATS Procedures, the rules that specify who can initiate a Change Request in MSATS.
- term: Initiator
  definition: The participant initiating a B2B Interaction.
- term: Insolvency Official
  definition: An official appointed in respect of a retailer or any property of the retailer, including a receiver,
    receiver and manager, administrator, provisional liquidator, liquidator, trustee in bankruptcy, or person having
    a similar or analogous function.
- term: Integer
  definition: A whole number, as distinguished from a fraction or a mixed number.
- term: Inter-regional
  definition: See Relevant Rules or Procedures
- term: Interactive
  definition: A right type assigned to a participant user by their participant administrator to access a Web Application
    or API
- term: Interactive Entity Table
  definition: The table allowing Create, Read, Update, or Delete privileges for an interactive entity to be assigned
    to a right. This determines what a participant user can access in MSATS.
- term: Interactive Transactions
  definition: Interaction with the MSATS web portal.
- term: Interconnector
  definition: See Relevant Rules or Procedures
- term: Intermediate
  definition: Generating units that are not included in the baseload generation or peaking generation are generally
    included in this category.
- term: Intermittent Generating Unit
  definition: See Relevant Rules or Procedures
- term: Intermittent Generator
  definition: A person who owns, operates or controls a generating unit
- term: Interval
  definition: Period over which interval energy data is recorded by the metering installation that corresponds to
    a TI or submultiples of a TI.
- term: Interval Meter
  definition: A meter that measures consumption of electricity for each specified interval (usually half-hourly
    to align with wholesale market trading intervals). It is manually read, or remotely read using a communications
    network.
- term: intra-regional
  definition: See Relevant Rules or Procedures
- term: Inventory Table
  definition: 'A table of devices for unmetered loads associated with each NMI as described in the Metrology Procedure:
    Part B.'
- term: IPRR
  definition: Integrating Price Responsive Resources. A project at AEMO aka VIPER aka Scheduled Lite
- term: IPWAN
  definition: Internet protocol wide area network
- term: IRP
  definition: Integrated Resource Provider. Any person who owns, controls or operates an integrated resource system
    connected to a transmission or distribution network must register as an Integrated Resource Provider
- term: IRS
  definition: Integrated Resource System
- term: IRSR
  definition: Inter Regional Settlement Residue. Relates solely to settlement transactions within a region – and
    not listed for auctions – but distributed to, or recovered from, the appropriate Transmission Network Service
    Providers (TNSPs).
- term: ISF
  definition: Improving Security Frameworks. A project that builds on existing tools and frameworks within the power
    system to enhance system security procurement frameworks
- term: ISF asset
  definition: A production unit, network element, other plant or facility that is under an agreement to provide
    a system security service/s.
- term: ISP
  definition: Integrated System Plan. AEMO’s whole-of-system plan that provides an integrated roadmap for the development
    of the National Electricity Market (NEM).
- term: ITFG
  definition: Industry Testing Focus Group
- term: ITT
  definition: Invitation to Tender
- term: JPB
  definition: Jurisdictional Planning Body. An entity nominated by the relevant Minister of the relevant participating
    jurisdiction as having transmission system planning responsibility (in that participating jurisdiction).
- term: JSON
  definition: JavaScript Object Notification
- term: JSON Root Schema
  definition: The schema comprising the entire JSON Bid and Offer File
- term: JSON Schema
  definition: A JSON document that is an object containing keywords or schema keywords. A JSON Schema can contain
    properties that are not schema keywords.
- term: Jurisdiction
  definition: participating jurisdiction (defined in the NER)
- term: Jurisdiction Code
  definition: Codes used in MSATS to identify the Jurisdiction a NMI belongs to, as specified in the CATS Procedures.
- term: Key Pair
  definition: SSL uses a technique called public-key cryptography, based on the concept of a Key Pair. The Key Pair
    consists of encrypted Public and Private Key data. It is only possible to decrypt the Public Key with the corresponding
    Private Key.
- term: kWh
  definition: Kilowatt hour
- term: Lack of Reserve
  definition: See Relevant Rules or Procedures
- term: LAN
  definition: Local area network
- term: Latest
  definition: The participant is set up to receive both current and next projected future version of aseXML-compliant
    files.
- term: Latest version
  definition: Refers to the tables, files, and reports deployed in the latest Data Model release.
- term: LCR
  definition: Largest Credible Risk
- term: Legacy file
  definition: A Data Model file currently supported but no longer updated. AEMO market system software releases
    support the Latest (n) and Legacy (n-1) integrations to AEMO’s market systems, allowing maintenance of participant
    interfaces across the system implementation at the AEMO end. AEMO refers to the previous version as the Legacy
    version, for example NETWORK_OUTAGE_LEGACY. AEMO automatically moves participants’ subscriptions to the Legacy
    file. This ensures participants on previous Data Model versions subscribed to files that change, continue to
    receive the same data. Once upgraded, and the new data is received, you can unsubscribe from the Legacy files.
    Participants still on discontinued file versions may receive different content if the Legacy file content has
    changed. AEMO expects participants to complete the corresponding release implementation at their end, moving
    from Legacy to Latest. Once participants upgrade their Data Interchange systems to the latest release, there
    is no requirement to maintain the Legacy report subscriptions.
- term: LF
  definition: Loss Factor. Annual calculations reflecting the amount of electricity lost on electrical transmission
    and distribution networks.
- term: LFAS
  definition: Load Following Ancillary Service. A power system security ancillary service in WA’s South West Interconnected
    System (SWIS), where assigned generators automatically and constantly change their output to compensate for
    load and wind fluctuations, to regulate system frequency.
- term: LFRG
  definition: Load Forecasting Reference Group. A group dedicated to sharing expertise and facilitating the continued
    development and accuracy of AEMO’s gas and electricity forecasts.
- term: LGC
  definition: Large Generation Certificates
- term: Life Support
  definition: 'A situation where an End User relies on electricity for the operation of life support equipment.
    A term defined in: • The NEM, apart from Victoria, in the NERR. • Victoria, in the Electricity Distribution
    Code and Energy Retail Code.'
- term: LIL
  definition: Large industrial loads
- term: Linked Bid
  definition: Multiple point-to-point combinations on the same or different facilities.
- term: Linked Category Bid
  definition: See Relevant Rules or Procedures
- term: Linked Quarter Bid
  definition: SRA procedures term
- term: LinkID
  definition: Identifies the MNSP interconnector link in AEMO's systems. A property in the MNSPBidLink object in
    the JSON bidding schema
- term: LMP
  definition: Longford to Melbourne Pipeline. The pipeline that transports gas from Longford in South Gippsland,
    Victoria, to Melbourne.
- term: LMRP
  definition: Legacy Meter Replacement Plan
- term: LNG
  definition: Liquefied Natural Gas. Natural gas cooled to liquid form so it can easily be transported.
- term: LNSP
  definition: Local Network Service Provider. The organisation that owns the poles and wires used to distribute
    electricity to premises within a geographical area and in the relevant participating jurisdiction.
- term: Load Profile
  definition: A profile of metering data aggregated across a specified set of connection points.
- term: Load Table
  definition: A table of Unmetered Device market loads published by AEMO at http://www.aemo.com.au/Electricity/National-Electricity-Market-NEM/Retail-and-metering.
- term: Local Area
  definition: The geographical area allocated to a network service provider by a Jurisdictional Regulator.
- term: log4j
  definition: A Java logging facility, enabling logging at run time without modifying the application binary.
- term: LOR
  definition: Lack of Reserve. A notification indicating a reduction in pre-determined electricity reserve levels,
    due to changes in supply or demand. The lowest notice, LOR1, tells the market more reserves are needed to cover
    a major contingency – the highest, LOR3, indicates the balance of supply and demand is so tight that load shedding
    is imminent or has begun.
- term: Lot Number
  definition: The lot reference number allocated to a street address prior to street numbering (except in the ACT).
- term: LP
  definition: Linear Program. A mathematical method that is used to determine the best possible outcome or solution
    from a given set of parameters or list of requirements.
- term: LPA
  definition: Linepack Account. A market-balancing mechanism in the Declared Transmission System (DTS) that accounts
    for imbalance and deviation payments, and the costs associated with unaccounted-for gas (UAFG).
- term: LR
  definition: Local Retailer. A business unit or related body corporate of the relevant local network service provider,
    or responsible under the laws of the relevant participating jurisdiction for the supply of electricity to franchise
    customers in that local area.
- term: LRC
  definition: Low Reserve Condition. When AEMO forecasts that a region's reserves will fall short of what is required
    to meet the reliability standard.
- term: LRET
  definition: Large-scale Renewable Energy Target. A target scheme that incentivises the development of renewable
    energy power stations in Australia.
- term: LRMC
  definition: Long-Run Marginal Cost. Describes the revenue required to exactly cover financing costs, and the fixed
    and variable operating and maintenance costs, of the investment over the generating system’s lifetime.
- term: LV
  definition: A Voltage equal to or less than 1kV.
- term: LV CT
  definition: Low voltage current transformer
- term: MAMP
  definition: Metering Asset Management Plan. A test plan developed and maintained by an MP in accordance with the
    Service Level Procedure.
- term: MAPS
  definition: Moomba to Adelaide Pipeline. A natural gas pipeline in South Australia delivering gas from the Cooper
    Basin gas wells near Moomba to Adelaide.
- term: Market Ancillary Services (MAS)
  definition: Market Ancillary Services
- term: Market Customer
  definition: See Relevant Rules or Procedures
- term: Market Floor Price
  definition: See Relevant Rules or Procedures
- term: Market Generator
  definition: See Relevant Rules or Procedures
- term: Market Network Service Provider
  definition: See Relevant Rules or Procedures
- term: Market Participant
  definition: See Relevant Rules or Procedures
- term: Market Price Cap
  definition: See Relevant Rules or Procedures
- term: Market Time
  definition: Australian Eastern Standard Time
- term: MarketNet
  definition: AEMO's private VPN for Registered Participants. A network of more than 300 registered participants
    in the National Electricity Market, including market generators, transmission network service providers, distribution
    network service providers, and market customers.
- term: Markets Portal
  definition: Web applications for registered participants only. Requires access to MarketNet.
- term: MAS
  definition: Market ancillary services
- term: Maximum Availability
  definition: The maximum planned availability in MW for the matching period.
- term: Maximum Credit Limit
  definition: See Relevant Rules or Procedures
- term: Maximum Units
  definition: See Relevant Rules or Procedures
- term: MC
  definition: Meter Coordinator; The Role Code used in MSATS for an MC is RP.
- term: MCE
  definition: Market Clearing Engine. A software system that determines daily operational and pricing schedules
    for the Victorian natural gas market.
- term: MCL
  definition: Maximum Credit Limit
- term: MCLs
  definition: Maximum Credit Limits
- term: MD
  definition: Maximum Demand. Forecasts to indicate peak demand for electricity, in this case at its half-hourly
    interval usage.
- term: MDA
  definition: Metering Data Agent. An agency that submits meter data to AEMO, including the timing and format of
    submissions.
- term: MDFF
  definition: Meter Data File Format. The standard format for delivery of metering data to market participants,
    service providers and registered participants.
- term: MDFF Data
  definition: The data contained in an electronic file formatted according to the Meter Data File Format Specification.
- term: MDFF Specification
  definition: The Meter Data File Format Specification for NEM12 & NEM 13.
- term: MDM
  definition: Meter Data Management system includes the Profile Preparation Service, Basic Meter Profiling, and
    Data Aggregation.
- term: MDM Contributory Suffix
  definition: A suffix defined in sections 6 and 7 of the NMI Procedure used to identify a stream of metering data.
    It is consistent with the NMISuffix contained in the 200 record of the MDFF interval metering datafile.
- term: MDM Data File
  definition: 'Meter Data Management Data File: The standard file for delivery of metering data to AEMO.'
- term: MDM Procedures
  definition: 'The MSATS Procedure: MDM Procedures.'
- term: MDP
  definition: Meter Data Provider. An organisation which installs, commissions, gathers, and verifies data remotely
    from meters in the National Electricity Market (NEM).
- term: MDQ
  definition: Maximum Daily Quantity. A withdrawal right for customers and/or market participants on the Declared
    Transmission System (DTS) for transported gas injected at Longford.
- term: Message Acknowledgement
  definition: An aseXML realisation of a Business Receipt.
- term: Meter Alarm
  definition: Any alarm within a metering installation designed to detect any unexpected occurrence, such as a loss
    of supply, VT or phase failure, tamper detection, reverse energy flow, pulse overflow, cycle redundancy check
    error and temperature or time tolerance.
- term: Meter Churn
  definition: Any alteration or replacement of a metering installation.
- term: Meter Data File Format Specification
  definition: Metering data delivered to participants is to conform to the Meter Data File Format Specification,
    see Meter Data File Format on AEMO's website.
- term: Meter Data Notification Process
  definition: 'The provision of metering data to participants as part of the MDP''s normal production process obligations,
    see B2B Procedures: Meter Data Process.'
- term: Meter Data Process
  definition: 'The overall process for the provision of metering data to a participant by an MDP. Requests by the
    appropriate participant for provision of missing metering data from an MDP, or the querying of the validity
    of any metering data supplied by an MDP. Has 3 component processes: Meter Data Notification Process, Provide
    Meter Data Process, and Meter Data Verification Process, see B2B Procedures: Meter Data Process.'
- term: Meter Data Verification Process
  definition: 'The process by which a participant queries the metering data received in a Meter Data Notification
    from an MDP. The process also allows a participant to provide an alternative substitution that may be considered
    by the MDP, see B2B Procedures: Meter Data Process.'
- term: Meter Provision
  definition: The provision, installation, and maintenance of the components of a metering installation.
- term: Meter Reading
  definition: Electricity consumption data taken from a meter, regardless of how it is obtained.
- term: Meter Register
  definition: The meter register data stored in MSATS, which includes both the metering register and other data.
- term: Meter Register Status Code
  definition: A code used in MSATS to delineate the status of a meter. For more detail, see the CATS Procedures.
- term: Meter Serial ID
  definition: A serial number that uniquely identifies each metering installation record associated with a NMI.
- term: Metering Administration System (MAS)
  definition: Metering Administration System. Predecessor to MSATS
- term: Metering Data Delivery Calendar
  definition: The Metering Data Delivery Calendar provides the cut-off dates for MDP data delivery.
- term: Metering Installation Type Code
  definition: The type of meter attached to a NMI as described in the CATS Procedures.
- term: Metering Service Provider
  definition: Either a Metering Provider or a Metering Data Provider.
- term: Method
  definition: The allowed operation for a resource, e.g. GET, POST, PUT, DELETE, and so on. These operations determine
    whether you’re reading information, creating new information, updating existing information, or deleting information.
- term: 'Metrology Procedure: Part A'
  definition: Part A National Electricity Market
- term: 'Metrology Procedure: Part B'
  definition: Part B Metering Data Validation, Substitution, and Estimation Procedure.
- term: MFP
  definition: Market Floor Price. The National Electricity Rules’ minimum at which gas can be bid, offered, or scheduled
    in the market. The AEMC’s Reliability Panel reviews the MFP every four years.
- term: MIBB
  definition: Market Information Bulletin Board. The IT interface through which AEMO communicates with gas market
    participants.
- term: MILP
  definition: Mixed Integer Linear Programming. An approach that determines the operation of the integrated power
    voltage and storage systems for the typical household demand profile.
- term: MIRN
  definition: Meter Identification Reference Number. A unique number that identifies each gas meter.
- term: ML
  definition: Megalitre
- term: ML/hr
  definition: Megalitres per hour
- term: MLF
  definition: Marginal Loss Factor. Reflects the impact of electricity losses along the transmission network between
    a connection point and the regional reference node of the National Electricity Market (NEM).
- term: MML
  definition: Market Minutes Lost. The number of interruptions in time experienced by customers.
- term: MNSP
  definition: Market Network Service Provider. A network service provider (NSP) that earns revenue from the spot
    market.
- term: Monthly
  definition: See Relevant Rules or Procedures
- term: Monthly product
  definition: See Relevant Rules or Procedures
- term: MOS
  definition: Market Operator Service. A standing arrangement between AEMO (the market operator) and pipeline operators
    for supplying or withdrawing gas beyond the quantities provided by the pipeline schedules.
- term: MP
  definition: Metering Provider. Accredited organizations authorised to install and maintain meters. In MSATS, it
    is referred to as an MPB.
- term: MPB
  definition: See MP
- term: MPC
  definition: Market Price Cap. The National Electricity Rules’ maximum price at which gas can be bid, offered,
    or scheduled in the market. The AEMC’s Reliability Panel reviews the MFP every four years.
- term: MPDC
  definition: Metering Provider Data Collection
- term: MPF
  definition: Market Participant Factor
- term: MRC
  definition: Maximum Responsive Component
- term: MRET
  definition: Mandated Renewable Energy Target. A government scheme that creates demand for electricity generated
    from renewable sources.
- term: MRIM
  definition: Manually Read Interval Meter. Digital meters which record usage in 30-minute intervals.
- term: MRL
  definition: Minimum Reserve Level. A calculation that works out the electricity generation capacity required to
    meet the Reliability Standard.
- term: MSATS
  definition: Market Settlement and Transfer Solutions. The procedures published by AEMO under clause 7.2.8 of the
    National Electricity Rules, which include those governing the recording of financial responsibility for energy
    flows at a connection point, the transfer of that responsibility between market participants, and the recording
    of energy flows at a connection point.
- term: MSATS File Exchange Protocol
  definition: 'The file exchange protocol used by MSATS, see MSATS File Exchange Protocol in the B2B Procedures:
    Technical Delivery Specification.'
- term: MSATS Notification
  definition: 'An MSATS transaction, see MSATS Procedures: CATS Procedures and B2B Procedures: Service Orders Process.'
- term: MSATS Participant Batcher
  definition: An application providing an interface for batch transactions (files).
- term: MSATS Procedures
  definition: 'All of the following procedures: CATS Procedures, WIGS Procedures, MDM Procedures, NMI Standing Data
    Schedule, NMI Procedure, and Part A of the NEM RoLR Processes.'
- term: MSGA
  definition: Market Small Generator Aggregator
- term: MSOR
  definition: Market and System Operations Rules. The policies and procedures governing Victoria’s Gas Retail Markets.
- term: MSP
  definition: Moomba to Sydney Pipeline. A transmission pipeline that operates from Moomba in South Australia across
    New South Wales to Sydney.
- term: MSUG
  definition: Market Systems User Group
- term: MT PASA
  definition: Medium Term Projected Assessment of System Adequacy. A 24-month supply demand forecast, published
    weekly, with daily resolution.
- term: MT PASA Offer Payload
  definition: The csv payload with the MT PASA Offer data
- term: MT PASA weekly offer period
  definition: Sunday–Saturday
- term: MW
  definition: Megawatt
- term: MW/h
  definition: Megawatt hour
- term: MW/minute
  definition: Megawatts per minute
- term: MWh/day
  definition: Megawatt hours per day
- term: MWHr
  definition: Megawatt hours
- term: MX
  definition: Threshold for optimisation of energy-limited plant
- term: MyDPID Update
  definition: Run once every quarter to update the Delivery point identifier (DPID) field based on Australia Post’s
    Postal Address File (PAF)
- term: n/a
  definition: Not applicable
- term: National B2B Infrastructure
  definition: 'Infrastructure (software and hardware) that physically enables B2B communication between participants.
    This includes, but is not necessarily limited to: MSATS B2B Handler (software and hardware), MSATS B2B gateways,
    communications between participants and MSATS, B2B gateways, and participant gateways.'
- term: National Electricity Market
  definition: See Relevant Rules or Procedures
- term: National Electricity Rules
  definition: See Relevant Rules or Procedures
- term: National Metering Index
  definition: See Relevant Rules or Procedures
- term: NCAS
  definition: Network Control Ancillary Services
- term: NCC
  definition: NMI Classification Code
- term: NECR
  definition: Non-energy Cost Recovery
- term: NEFR
  definition: National Electricity Forecasting Report
- term: NEL
  definition: National Electricity Law
- term: NEM
  definition: See Relevant Rules or Procedures
- term: NEM Retail
  definition: MSATS and B2B systems
- term: NEM RoLR Processes
  definition: 'NEM RoLR Processes – Part A: MSATS Procedure: RoLR Procedures – Part B: B2B Procedure: RoLR Process.'
- term: NEM RTO
  definition: National Electricity Market Real Time Operations
- term: NEM Wholesale
  definition: EMMS
- term: NEMDE
  definition: NEM Dispatch Engine (previously SPD). Software developed and used by AEMO to ensure the central dispatch
    process maximises value of trade, subject to the various constraints.
- term: NEMW-CF
  definition: National Electricity Market Wholesale Consultative Forum. A forum providing stakeholders and interested
    parties with the opportunity to contribute ideas into developing and improving the National Electricity Market
    (NEM).
- term: NEMweb
  definition: 'Public market data in csv file format: http://www.nemweb.com.au/'
- term: NEO
  definition: National Electricity Objective. The objective to promote efficient investment in, and efficient operation
    and use of, electricity services for the long-term interests of consumers of electricity with respect to the
    reliability, safety and security of the national electricity system.
- term: NER
  definition: National Electricity Rules. The rules made under the National Electricity Law (NEL). They govern the
    day-to-day operations of the National Electricity Market (NEM) and provide the framework for network regulation.
- term: NERL
  definition: 'National Energy Retail Law: https://www.legislation.sa.gov.au/index.aspx'
- term: NERR
  definition: National Energy Retail Rules
- term: Network Control Ancillary Services
  definition: See Relevant Rules or Procedures
- term: Network Tariff
  definition: The rate the network business charges the retailer for the use of their network.
- term: Network Tariff Code
  definition: A nominated code for the Network Tariff charged by the NSP.
- term: New FRMP
  definition: The FRMP identified on a change request prior to the change request being completed.
- term: New MDP
  definition: The MDP identified on a change request prior to the change request being completed.
- term: New Parties
  definition: Entities associated with the meter installation and retail arrangements to which a consumer transfers
    to.
- term: New Retailer
  definition: Following the completion of a transfer of a NMI, the retailer that is the current FRMP.
- term: New RP
  definition: 'The responsible person (RP) identified on a change request prior to the change request being completed,
    see MSATS Procedures: CATS Procedures.'
- term: Next Scheduled Read Date
  definition: 'The date of the next scheduled meter read to be undertaken by the current MDP or MPC, see MSATS Procedures:
    CATS Procedures.'
- term: NGATS
  definition: NSW Gas Abatement Scheme. A mandatory scheme that aimed to lower greenhouse gas emissions in New South
    Wales. It ran from 2003 to 2012.
- term: NGERAC
  definition: National Gas Emergency Response Advisory Committee. A working group of the COAG Energy Council that
    advises governments on responses to, and management of major gas supply interruptions affecting two or more
    jurisdictions.
- term: NGF
  definition: National Generators Forum. A forum for representatives of electricity producers in the National Electricity
    Market (NEM).
- term: NGL
  definition: National Gas Law
- term: NGR
  definition: National Gas Rules. The rules made under the NGL. They govern access to natural gas pipeline services
    and elements of broader natural gas markets.
- term: NMAS
  definition: Non-Market Ancillary Services. Services to support power system security in the NEM that are acquired
    by AEMO outside the market, under bilateral contracts. AEMO can acquire SRAS and NSCAS in this way.
- term: NMI
  definition: See Relevant Rules or Procedures
- term: NMI Address
  definition: The address where the connection point the NMI refers to is located (the site address). During a consumer
    transfer, this information is supplied to the new retailer by the LNSP and acts as a check for the correct NMI
    identification.
- term: NMI Checksum
  definition: A number, one digit in length, used to validate that a NMI supplied to CATS is a valid.
- term: NMI Classification Code
  definition: A code identifying the type of consumer to which a NMI belongs, e.g. large or small wholesale generators.
- term: NMI Data stream
  definition: The term used to represent a NMI suffix required by MDM to enable the metering data associated with
    a NMI to be correctly identified.
- term: NMI Discovery Search 1
  definition: The process of finding a NMI and the NMI Checksum by searching MSATS using the Site, the DPID or a
    meter’s serial number. For more details, see the CATS Procedures.
- term: NMI Discovery Search 2
  definition: The process of entering a NMI and NMI Checksum in MSATS to obtain NMI Standing Data. For more detail,
    see the NMI Standing Data Access Rules in the CATS Procedures.
- term: NMI Discovery Search 3
  definition: The search process that can only be used for one of the purposes detailed in the CATS Procedures.
- term: NMI Master Record
  definition: The NMI master record with an end date set to the year 9999.
- term: NMI Procedure
  definition: 'MSATS Procedures: National Metering Identifier.'
- term: NMI Search Rules
  definition: The search available in MSATS enabling a participant to identify a NMI when the only information available
    is the DPID, the meter serial number, or the Site address. For more details, see the CATS Procedures.
- term: NMI Standing Data
  definition: See National Electricitiy Rules
- term: NMI Standing Data Access Rules
  definition: The search available in MSATS enabling a participant to identify nominated CATS Standing Data.
- term: NMI Standing Data Schedule
  definition: The AEMO document called NMI Standing Data Schedule.
- term: NMI Status
  definition: A code identifying the status of a NMI, for example active or inactive.
- term: NMI Status Code
  definition: A code used in MSATS to determine if a NMI can be the subject of a retail transfer. For more detail,
    see the CATS Procedures.
- term: NMNS
  definition: Non-Market Non-Scheduled generating unit. A generating unit that sells its entire output directly
    to a local retailer or customer at the same connection point under a power purchase agreement. It is not scheduled
    by AEMO as part of central dispatch.
- term: NMS
  definition: Non-Market Scheduled generating unit. A generating unit that sells its entire output directly to a
    local retailer or customer at the same connection point under a power purchase agreement. It is scheduled by
    AEMO as part of central dispatch.
- term: Nomination Cut-off Time
  definition: See Relevant Rules or Procedures
- term: Non-business Day
  definition: A weekend or public holiday Profile Type
- term: Non-Controlled Load
  definition: A load that is not a Controlled Load.
- term: Non-Registered Generation Information User
  definition: A user who requires Generator Information Survey Application access to create and submit a generator
    survey
- term: Non-Registered Participant
  definition: A person who is NOT registered by AEMO in any one or more of the categories listed in the Energy rules.
- term: Non-scheduled Generating Unit
  definition: See Relevant Rules or Procedures
- term: Non-Scheduled Generation
  definition: Generation by a generating unit that is not scheduled by AEMO as part of the central dispatch process,
    and which has been classified as a non-scheduled generating unit in accordance with Chapter 2 of the NER.
- term: Non-technical B2B Procedures
  definition: 'The B2B Procedures other than the B2B Procedures: Technical Guidelines for B2B Procedures and the
    B2B Procedures: Technical Delivery Specification.'
- term: NOS
  definition: Network Outage Scheduler. Lists the planned network outages for work on the transmission system of
    the NEM.
- term: Not Completed
  definition: A ServiceOrderStatus indicating the Primary Work is not complete.
- term: Notification
  definition: A transaction that does not have a corresponding reply transaction, see Notification Business Transaction
    Pattern.
- term: Notification Business Transaction Pattern
  definition: A B2B interaction characterised by one participant sending a notification transaction (e.g. CustomerDetailsNotification)
    to another participant without a corresponding reply transaction.
- term: Notification Detail
  definition: Data Payload for the One Way Notification.
- term: Notified Party
  definition: The receiver of a B2B Transaction or B2B Acknowledgement for notification purposes only and not required
    to perform any services for the Initiator.
- term: NQGP
  definition: North Queensland Gas Pipeline. A transmission pipeline located in north-east Queensland, supplying
    gas from Moranbah gas processing plant to large industrial customers in Townsville.
- term: NRNSP
  definition: Non Registered Network Service Provider. A network service provider that has been granted an exemption
    from registration.
- term: NSA
  definition: Network Support Agreement. The binding terms of agreement that form a contract.
- term: NSCAS
  definition: Network Support and Control Ancillary Services. A non-market service that may be procured by AEMO
    or Transmission Network Service Providers to maintain power system security and reliability, and to maintain
    or increase the power transfer capability of the transmission network.
- term: NSL
  definition: Net System Load. A method used by AEMO to approximate how much electricity is used by all consumers
    with accumulation meters in a region, for each half hour of the day.
- term: NSLP
  definition: Net System Load Profile. A profile applied to convert all second-tier basic meter readings into energy
    consumption for each 30-minute trading interval for settlement purposes.
- term: NSP
  definition: Network Service Provider. A party that owns, operates or controls an electricity transmission or distribution
    system.
- term: NSP2
  definition: 'Second Network Service Provider: The Role assigned to a DNSP for a transmission connection point
    (wholesale NMIs) having two NSP roles.'
- term: NSRD
  definition: Next Scheduled Read Date. The day in which the data from a meter will next be taken.
- term: NSRD Update
  definition: AEMO processes CR5070 & CR5071 Next Scheduled Read Date (NSRD) separately to other CATS Change Request
    types. They are completed immediately resulting in a blind update outside of the History Model This process
    is run as a subset of CR processing and is fully aligned to the CATS & WIGS Procedures
- term: NTC
  definition: Network Tariff Code. An operational document for customers, electricity retailers and consultants,
    setting out the codes, application rules and rates for each network tariff.
- term: NTNDP
  definition: National Transmission Network Development Plan. An annual report with a 20-year outlook that identifies
    transmission and generation development opportunities for a range of market development scenarios.
- term: NTP
  definition: National Transmission Planner. Part of AEMO’s role under the National Electricity Law (NEL) and in
    accordance with clause 5.20.2 of the National Electricity Rules (NER). Includes publication of a yearly plan
    for the future of network.
- term: OAS
  definition: Open API Specification
- term: Objected
  definition: A status point of a Change Request.
- term: Objection
  definition: A type of transaction raised in relation to a Change Request.
- term: Objection Clearing Period
  definition: The number of business days an Objection can remain in MSATS. If the Objection is not withdrawn by
    the end of the Objection Clearing Period, it is Cancelled by MSATS.
- term: Objection Code
  definition: A code used in MSATS representing the only grounds on where an Objection can be lodged. For a list
    of Objection Codes, see the CATS Procedures.
- term: Objection Logging Period
  definition: The number of business days available to a participant for entering an Objection in MSATS.
- term: Objection Rules
  definition: The rules applicable in MSATS that determine how Objections are used for each Change Reason Code.
    For more details, see the CATS Procedures.
- term: OCD
  definition: Over-Constrained Dispatch. The condition where any energy or Frequency Control Ancillary Services
    (FCAS) price from any region is greater than or equal to Value of Loss Load (VoLL) or less than or equal to
    market price floor and there exists an eligible violated constraint.
- term: OCGT
  definition: Open Cycle Gas Turbine. An internal combustion engine consisting of a compressor, combustor and power
    turbine that compresses and ignites an air/fuel mixture to create rotary motion.
- term: Off-Market
  definition: An End Use Customer within an embedded network who purchases electricity from the EENSP who supplies
    the electricity.
- term: Offer
  definition: Energy, Dispatch, FCAS Offer, MNSP, MTPASA Bid or Offer submission
- term: Offer Payload
  definition: Bid or Offer submitted by a participant
- term: OI
  definition: Open Interest
- term: Old retailer
  definition: Any previous FRMP for a NMI.
- term: On-Market
  definition: An End Use Customer at a child connection point who purchases electricity from a retailer.
- term: On/Off Table
  definition: 'A table recording the switching status (On = 1, Off = 0) for each trading interval for unmetered
    loads associated with a NMI as described in the Metrology Procedure: Part B.'
- term: One Way Notification
  definition: A B2B Procedure defining the standard processes and transaction data requirements for one way messaging
    transactions between market participants. It provides a process where participants can send messages to other
    participants for multiple NMIs in a single transaction.
- term: ONSG
  definition: Other Non-scheduled Generators
- term: OPDMS
  definition: Operations and Planning Data Management System. A software system that supports the planning and operations
    functions in an electricity market environment.
- term: Open Interest (ASX)
  definition: See Relevant Rules or Procedures
- term: OpenAPI specification document
  definition: The file, either in YAML or JSON, describing your REST API. Follows the OpenAPI specification format.
- term: Operator
  definition: AEMO
- term: OPF
  definition: Operational Forecasting team within AEMO Operations
- term: OSM
  definition: Operational Security Mechanism. The OSM values, procures and schedules security services not already
    procured through a market or other arrangements
- term: Other Non-scheduled Generators
  definition: Non-scheduled Generators smaller than 30 MW and are not PV
- term: OTSA
  definition: Operational Transportation Service Agreement
- term: Outstandings
  definition: See Relevant Rules or Procedures
- term: P5MIN
  definition: 5 minute pre-dispatch
- term: PA
  definition: Participant Administrator. Super-users who manage and perform system administration tasks for their
    own organisation’s participant users.
- term: PA Right
  definition: The rights assigned to a PA by the AEMO System Administrator.
- term: PACR
  definition: Project Assessment Conclusion Report. A document published at the end of a Regulatory Investment Test
    (RIT) process, that assesses project parameters and delivers recommendations.
- term: PADR
  definition: Project Assessment Draft Report. A draft document that identifies a preferred option, outlines feedback
    received from stakeholders on the PSCR, and seeks feedback from stakeholders on the preferred option before
    a RIT project can be concluded.
- term: Parameters
  definition: 'Parameters are options you pass with the endpoint (such as specifying the response format or the
    amount returned). There are four types of parameters: header parameters, path parameters, query string parameters,
    and request body parameters. The different types of parameters are often documented in separate groups on the
    same page. Not all endpoints contain each type of parameter. See Parameters for more details.'
- term: Parent FRMP
  definition: The retailer who is the Current FRMP for a parent connection point.
- term: Parent Name
  definition: The Embedded Network Code populated in the EmbNetParent field in MSATS for a Parent NMI to indicate
    the NMI is a parent for a specified embedded network.
- term: Partially Completed
  definition: A Service Order Status indicating the Recipient has completed the Primary Work but there are outstanding
    matters requiring attention.
- term: Participant's DBMS
  definition: Contains the data received from AEMO into tables matching the Data Model.
- term: Participant Administrator
  definition: Creates and maintains access to AEMO systems for their Participant ID users.
- term: Participant API Gateway
  definition: The interface implemented by participants where AEMO pushes messages.
- term: Participant Categories
  definition: Reflects the registration requirements, responsibilities, and functions of each participant type.
- term: Participant Directories
  definition: 'Participant inbox and outbox used by the B2B e-Hub Handler, see B2B Procedures: Technical Delivery
    Specification.'
- term: Participant File Server
  definition: The publishing point from AEMO systems to participant systems. Each participant is allocated an account
    and access to private and public areas. Participants are responsible for interfacing with the participant file
    server.
- term: Participant Gateways
  definition: 'Hardware and software used by a participant to send and receive B2B files, see B2B Procedures: Technical
    Delivery Specification.'
- term: Participant ID
  definition: Registered participant identifier; A company can have more than one Participant ID.
- term: Participant Relationship
  definition: Where a participant has a role recorded in MSATS with respect to a connection point.
- term: Participant User
  definition: A Participant ID's users created and maintained by the Markets Portal PA in the URM.
- term: Participant User ID
  definition: The user ID you used to login to the system.
- term: Party
  definition: The initiator of the Reallocation
- term: PASA
  definition: Projected Assessment of System Adequacy. except executable files e.g., .DLLs, .LIBs and .EXEs with
    the user mentioned. See National Energy Rules
- term: PASA Availability
  definition: PASA Availability For a scheduled generating unit, scheduled bidirectional unit, scheduled load or
    scheduled network service in a given period, its available physical plant capability (taking ambient weather
    conditions into account) and any additional physical plant capability that can be made available during that
    period within a given recall period in accordance with the reliability standard implementation guidelines
- term: Path
  definition: Parameters in the path of the endpoint, before the query string (?). Path parameters are usually set
    off within curly braces.
- term: Payload
  definition: 'The content in the csv file. For example: For APIs, it is the data sent by a POST request that sits
    after the API header. For MSATS transactions, it is the data wrapped in the standard aseXML wrapper. For NEM
    reports it is the csv payload compressed in a zip file.'
- term: Payment Date
  definition: Defined in the Energy rules
- term: PCO
  definition: Participant Current Outstandings
- term: PCT
  definition: Pipeline Capacity Trading. An exchange-based market that allows participants to trade space gas pipeline
    capacity. It operates as part of the Gas Supply Hub (GSH).
- term: PD
  definition: Pre-dispatch
- term: pdr
  definition: Participant Data Replication
- term: pdrBatcher
  definition: Software responsible for transferring files to and from AEMO's participant file server to the participant's
    local Data Interchange folders. It can be installed in any environment supporting Java.
- term: pdrLoader
  definition: Software responsible for loading files to and from participant's local Data Interchange folders to
    the participant's DBMS. It can be installed in any environment supporting Java.
- term: Peaking
  definition: Generating units that are relatively expensive to run and generally run only for a few hours per day
    when the demand is high.
- term: Pending
  definition: A status point of a Change Request.
- term: Pending Validation
  definition: A status point of a Change Request.
- term: Period
  definition: The 288 periods from 4:30 am to 4:00 am.
- term: Period ID
  definition: The value for each trading interval (1-288)
- term: PF
  definition: Power Factor. Always a number between 0 and 1. Within an AC electric power system, it is defined as
    the ratio of the real power (P measured in the units MW) flowing to the load, to the apparent power (S measured
    in the units MVA).
- term: Physical Delivery
  definition: See Relevant Rules or Procedures
- term: PID
  definition: Participant ID
- term: Pipeline segment
  definition: See Relevant Rules or Procedures
- term: Plant
  definition: See Relevant Rules or Procedures
- term: Plant Availability
  definition: See Relevant Rules or Procedures
- term: PMS
  definition: Portfolio Management System
- term: POC
  definition: Power of Choice. A government-led, industry-wide program to provide consumers with more opportunities
    to make informed choices about the way they consume electricity. PoC was implemented in 2017.
- term: POE
  definition: Probability of Exceedance. A generalised approach to defining the probability of exceedance of electricity
    demand forecasts. It means the likelihood of a forecast being met or exceeded, and is expressed as a percentage
    (10%, 50% or 90%), or as a 1-in-2, 1-in-10, or 1-in-20 years probability.
- term: POP
  definition: Point of presence (in network)
- term: PPS
  definition: 'Profile Preparation Service: Calculates profile shapes by using algorithms and interval energy data.
    The calculation of the NSLP or the CLP.'
- term: PQD
  definition: Power Quality Data. Measurements of power supply characteristics exchanged between participants and
    AEMO.
- term: Pre-consent Market Facilitation
  definition: Refers to the ability of a party, such as a prospective retailer, to obtain information about a NMI
    in which it currently does not have an interest. While typically, this may be to obtain information to facilitate
    quotation and transfer, the policies governing the use of this functionality are determined by jurisdictions
    and the access and data available is limited based on those policies.
- term: Pre-dispatch
  definition: See Relevant Rules or Procedures
- term: Pre-production
  definition: AEMO’s test system available to participants
- term: Preliminary EFP Trade Submission
  definition: Optional information provided to AEMO by Trading Participants prior to the expiry of an EFP Trade
    (does not have a Gas Future ID). The Preliminary EFP Trade Submission price is the most recent daily settlement
    price of the Futures product. The price used in the Preliminary EFP Trade Information is indicative only and
    may change for the Final EFP Trade Submission.
- term: Preliminary Statement
  definition: See Relevant Rules or Procedures
- term: Preliminary Transfer
  definition: Optional information provided to AEMO by Trading Participants prior to the expiry of a future contract,
    containing the Preliminary Transfer position and price (does not have a Gas Future ID) Providing the information
    passes validation, AEMO uses it in Prudential Calculations
- term: Previous Retailer
  definition: Refer to old retailer.
- term: Previous version
  definition: Refers to the tables, files, and reports deployed in the previous Data Model release.
- term: Price ($/MWh)
  definition: Price per megawatt hour
- term: Price Bands
  definition: See Relevant Rules or Procedures
- term: Primary Work
  definition: The activity described by the ServiceOrderType field of a Service Order Request.
- term: Private Key
  definition: The secret Private Key is a text file used initially to generate a Certificate Signing Request (CSR),
    and later to secure and verify connections.
- term: Privilege
  definition: Refers to the create, read, update, and delete actions available to an entity. These privileges set
    the actual access rights to the entity, for example the ability to create or edit a participant record as opposed
    to just viewing rights to the participant record.
- term: Privileges
  definition: The create, read, update, delete, or execute privileges assigned to a Right. These privileges set
    the access rights, for example the ability to create or edit a participant record as opposed to just viewing
    rights to the participant record.
- term: Probability of Exceedance
  definition: The likelihood a maximum or minimum demand forecast is met or exceeded
- term: Product
  definition: See Relevant Rules or Procedures
- term: Production
  definition: AEMO’s live system
- term: Profile Area
  definition: A geographical area comprising a group of one or more TNIs where a single NSLP is calculated. If part
    of an LNSP local area is located within the local area of another LNSP, that part of the local area of the first
    LNSP is considered to be part of the profile area of the second LNSP.
- term: Profile Name
  definition: A code identifying the name of the algorithmically derived shape that is used to allocate a Data stream’s
    metering data to TIs.
- term: Profile Type (also day type)
  definition: 'Flat: same quantity of energy or cost is applied to all days during the Reallocation period. Business:
    same quantity of energy or cost is applied to Business Days only during the Reallocation period. Non-business:
    same quantity of energy or cost is applied for non-business days during the Reallocation period.'
- term: Profile/Profiling
  definition: Use of an algorithm to allocate basic meter readings to each 30 minute trading interval during the
    meter reading period.
- term: Proportional Entitlements
  definition: See Relevant Rules or Procedures
- term: Proposed Change Date
  definition: The proposed date when a Role transfers from one participant to another.
- term: Prospective Change
  definition: A change to a NMI record that takes effect on a date after the date the Change Request is submitted.
- term: Prospective Days
  definition: A situation where the number of days under consideration occur after the current date.
- term: Prospective Period
  definition: The maximum period when a Prospective Change can be made.
- term: Prospective Retailer
  definition: Retailer who may initiate a defined B2B process on the basis that they are in the process of applying
    for responsibility of a given site (using the Customer Transfer process in MSATS).
- term: Provide Meter Data Process
  definition: 'The provision by an MDP of metering data specifically requested by a participant, see B2B Procedures:
    Meter Data Process.'
- term: Prudential Calculation
  definition: Settlements and Prudential Methodology
- term: Prudential exposure
  definition: Includes the organisation’s settlement component in the last prudential run (outstandings dollar amount)
    and the forward exposure. This includes all forward exposure amounts (inclusive of the forward exposure GST
    amount) attributable to its associated trading participants’ submitted or executed orders or both, and participants’
    authorised reallocations, that are entered into since the last initial settlement run.
- term: PSCR
  definition: Project Specification Consultation Report. The first report in a Regulatory Investment Test (RIT)
    process, that describes a need and potential options to meet this need.
- term: Put Process
  definition: 'The FTP Put command used to copy files between participant inboxes and outboxes, see B2B Procedures:
    Technical Delivery Specification.'
- term: PV Non-scheduled Generators
  definition: PV systems larger than 100 kW but smaller than 30 MW
- term: PVNSG
  definition: PV Non-scheduled Generators
- term: QCLNG
  definition: Queensland Curtis LNG. A LNG export facility at Gladstone in Central Queensland.
- term: QED
  definition: Quarterly Energy Dynamics
- term: QGP
  definition: Queensland Gas Pipeline. Pipeline linking the Wallumbilla gas hub in south-central Queensland to large
    industrial gas users in Gladstone and Rockhampton.
- term: QNI
  definition: Queensland – New South Wales Interconnector. Infrastructure that connects the energy transmission
    systems of Queensland and New South Wales. It runs between Dumaresq in New South Wales and Bulli Creek in Queensland.
- term: Qualification Procedure
  definition: The Procedure for Metering Providers, Metering Data Providers and Embedded Network Managers.
- term: Qualifying days
  definition: Calendar weekdays which are not (local) state public holidays (in that region) and on which demand
    response events have not been called or tested for the WDRU.
- term: Qualifying Resources
- term: Quantity (MWh)
  definition: Referred to as energy offset in the Reallocation Procedures
- term: Quarter
  definition: See Relevant Rules or Procedures
- term: Query String Parameters
  definition: Parameters in the query string of the endpoint, after the ?.
- term: RBP
  definition: Roma to Brisbane Pipeline. A transmission pipeline that transports natural gas between the Wallumbilla
    gas hub, near Roma, and Brisbane and regional centres in between.
- term: RCM
  definition: Reserve Capacity Mechanism. A protocol ensuring that there is sufficient generation capacity in the
    South West Integrated System (SWIS) by setting a reserve capacity requirement two years ahead. It is unique
    to Western Australia.
- term: Read Privilege
  definition: The access right to view records represented by an entity.
- term: Read Type Code
  definition: Types of meter readings detailed in the CATS Procedures.
- term: Real numbers
  definition: Include natural numbers, whole numbers, integers, rational numbers, and irrational numbers. For example,
    3, 0, 1.5, 3/2, √5, and so on are real numbers.
- term: Reallocation
  definition: A reallocation transaction, as defined in the NER
- term: Reallocation Request Service
  definition: Refers to Reallocation web applications for any Market
- term: Reallocation Transaction
  definition: See Relevant Rules or Procedures
- term: Reallocation Transaction (reallocation)
  definition: An authorised request in the Reallocations web application, of an agreement between two market participants
    to settle all or part of their mutual settlement obligations. The request generates matching debit and credit
    transactions of equal value that are included in the participants’ settlement statements.
- term: Reallocation Values
  definition: The value of the Reallocation for each Agreement Type (1-48)
- term: Reallocations
  definition: Reallocation Request Service. See Relevant Rules or Procedures
- term: Reallocator
  definition: See Relevant Rules or Procedures
- term: Rebid
  definition: Offer Type submitted after the Offer Cut-off Time (12:30 PM the day before the Trading Day
- term: REC
  definition: 'Registered Electrical Contractor: A person registered by the relevant safety regulator in each jurisdiction.'
- term: Recall Period
  definition: The advance notice (in hours) that a scheduled resource will require to achieve the PASA Availability
    MW for this trading interval.
- term: Recall Time
  definition: The time the Participant ID expects the Scheduled Generating Unit to take to return to full PASA Availability
    under normal conditions
- term: Receipt Point
  definition: See Relevant Rules or Procedures
- term: Receipt Zone
  definition: See Relevant Rules or Procedures
- term: Recipient
  definition: The receiver of a B2B Transaction or B2B Acknowledgement. This can be either a notification, request
    for data or request to perform work.
- term: Reconciliation Process
  definition: 'The provision of the customer details held by the FRMP for all of their current customers in the
    DNSP''s area at the time of the data extract, see B2B Procedures: Customer and Site Details.'
- term: Reference Price
  definition: The average price for the trading location and gas day to which a reallocation relates.
- term: Region
  definition: See Relevant Rules or Procedures
- term: Regional
  definition: See Relevant Rules or Procedures
- term: Regional Reference Price
  definition: See Relevant Rules or Procedures
- term: Register Identifier Status Code
  definition: A code in MSATS indicating if a Meter Register is active. For more detail, see the CATS Procedures.
- term: Registered B2B e-Hub Participant
  definition: A participant accredited to use the B2B e-Hub, e.g. Local Retailers, Market Customers, and Distribution
    Network Service Providers.
- term: Registered Generation Information User
  definition: A user who logs in using the Market portal and requires Generator Information Survey Application access
    to create and submit a generator survey
- term: Registered Participant
  definition: See Relevant Rules or Procedures
- term: Registrable Capacities
  definition: Registered participant categories, such as customer, generator, network service provider, trader,
    reallocator, special participants, market participant, and intending participants.
- term: Regulated Time Frame
  definition: The timing requirement imposed on a service provider by the relevant jurisdictional instrument for
    the conduct of the regulated service.
- term: Regulator
  definition: In the context of a RoLR Event, the AER for the NEM, apart from Victoria, and the Essential Services
    Commission of Victoria for Victoria.
- term: Reject
  definition: 'When used in the context of a transaction, indicates that the recipient of the transaction has rejected
    the transaction using a business acceptance/rejection with an ase: Status of “Reject”, see all B2B Procedures.'
- term: Rejected
  definition: A status point of a Change Request. Meaning the Change Request failed a validation test in MSATS.
- term: Relevant Quarter
  definition: See Relevant Rules or Procedures
- term: Reliability and Emergency Reserve Trader
  definition: See Relevant Rules or Procedures
- term: Reliability Forecasting (RF) User
  definition: The RF users are the owner of the generator survey portal and require Power Apps Premium (BD) license
    to access the Microsoft Dynamics CRM
- term: Reliability Standard
  definition: The part of the power system security and reliability standards by that name published by the Reliability
    Panel.
- term: Report
  definition: 'A data report that loads into a data model table. Identified by its type, subtype, and version. For
    example: BILLING,BILLINGASPAYMENTS,2'
- term: Request
  definition: The way information is returned from an API. In a request, the client provides a resource URL with
    the proper authorization to an API server. The API returns a response with the information requested.
- term: Request and Response Transactions
  definition: See request/response business transaction pattern.
- term: Request Body Parameters
  definition: Parameters in the request body. Usually submitted as JSON.
- term: Request/Response Business Transaction Pattern
  definition: A B2B interaction characterised by one participant sending a request transaction (e.g. ServiceOrderRequest)
    to another participant and the other participant responding with a corresponding response transaction (e.g.
    ServiceOrderResponse). In some cases, a notification is sent in response to a request transaction (e.g. a MeterDataNotification
    providing the metering data requested in a ProvideMeterDataRequest).
- term: Requested
  definition: A status point of a Change Request.
- term: Required Time Frame
  definition: 'The time allowed for the completion of the requested work. This period represents the regulated time
    frame for the performance of the work requested (where a regulated time frame exists) or an agreed period specified
    in the relevant B2B Procedures. See B2B Procedures: Service Order Process.'
- term: Required Timeframe
  definition: The time allowed for the completion of work requested in a Service Order. Can be a Jurisdictional
    requirement or an agreed period of time.
- term: RERT
  definition: Reliability and Emergency Reserve Trader. A function conferred on AEMO to maintain power system reliability
    and security. It does so by using contracts to procure reserve.
- term: RERT Panel
  definition: A panel of entities recruited by AEMO in accordance with the RERT guidelines that might be called
    upon to tender for and enter into a reserve contract in Medium Notice Situations and Short Notice Situations.
- term: Residential
  definition: As defined in the NERL.
- term: Response
  definition: The information returned by an API after a request is made. Responses are usually in JSON or XML format.
- term: Response Example
  definition: The response example shows a sample response from the request example; the response schema defines
    all possible elements in the response. The response example is not comprehensive of all parameter configurations
    or operations, but it should correspond with the parameters passed in the request example. The response lets
    developers know if the resource contains the information they want, the format, and how that information is
    structured and labeled. The description of the response is known as the response schema. The response schema
    documents the response in a more comprehensive, general way, listing each property that could possibly be returned,
    what each property contains, the data format of the values, the structure, and other details.
- term: REST
  definition: The Representational State Transfer API architecture
- term: RET
  definition: Renewable Energy Target. An Australian government scheme designed to reduce emissions of greenhouse
    gases in the electricity sector and encourage the additional generation of electricity from sustainable and
    renewable sources.
- term: Retail Customer
  definition: 'The person consuming the electricity at the connection point, see B2B Procedures: Service Order Process.'
- term: Retail Electricity Market Procedures
  definition: The number of procedures that govern the operation of the retail market.
- term: Retailer
  definition: See Relevant Rules or Procedures
- term: Retrospective Change
  definition: A change to a NMI record that becomes effective on or before the date the Change Request is submitted.
- term: Retrospective Days
  definition: A situation where the days under consideration must either be the date of a Change Request or a date
    preceding the date of the Change Request.
- term: Retrospective Period
  definition: The maximum period where a Retrospective Change can be made.
- term: Right Type
  definition: Batch, interactive, or both.
- term: RIS
  definition: Renewable Integration Study
- term: RIT-D
  definition: Regulatory Investment Test for Distribution. A regulatory mechanism that applies an economic cost-benefit
    test on new distribution network investments proposed for the National Electricity Market (NEM).
- term: RIT-T
  definition: Regulatory Investment Test for Transmission. A regulatory mechanism that applies an economic cost-benefit
    test on new transmission electricity investments proposed for the National Electricity Market (NEM).
- term: RMC
  definition: Registration Management Client
- term: RMS
  definition: Registration Management System
- term: RoC
  definition: 'RoLR of Choice: The nomination of a RoLR by an End Use Customer (as classified in s.2 of the National
    Energy Retail Law) and agreed by the retailer to be its FRMP in a RoLR Event.'
- term: Role
  definition: The role a company has with a connection point in CATS. A single company can have more than one role
    associated with a NMI.
- term: Role Code
  definition: A code used in MSATS to identify the association a participant has with a NMI. For a list of Role
    Codes, see the CATS Procedures.
- term: ROLR
  definition: Retailer of Last Resort. A scheme principally designed to ensure that in the event of retailer failure,
    arrangements are in place to ensure customers continue to receive electricity and/or gas supply.
- term: RoLR Effective Transfer Date
  definition: The first day after the declaration of a RoLR Event. The date when the NMIs where the Failed Retailer
    was the FRMP are transferred to their RoLR, making the RoLR the FRMP for those NMIs.
- term: RoLR Event
  definition: An event triggering the transfer of End Use Customers to a RoLR.
- term: RoLR Event Affected Jurisdiction
  definition: The Jurisdiction affected by a RoLR Event.
- term: RoLR Event Affected MSATS Participant
  definition: 'MSATS participants potentially affected by a RoLR Event include: • Those with a current Role for
    any NMI where the Failed Retailer was assigned to one or more MSATS roles on the RoLR Effective Transfer Date,
    including: the Failed Retailer (the current FRMP, LR or both), the Current LNSP, the Current MDP, or the Current
    MPB. • The RoLR for each RoLR Event Affected NMI. • If the Failed Retailer is a LR, the replacement LR. • Those
    having a Role for a NMI where at the time of the RoLR Event, the Failed Retailer was nominated as the New FRMP
    on an incomplete Change Request or MSATS Participants nominated in a new Role on such a Change Request.'
- term: RoLR Event Affected NMI
  definition: 'NMIs where the Failed Retailer was assigned to one or more Roles for the RoLR Effective Transfer
    Date NMIs where at the time of the RoLR Event, the Failed Retailer was nominated as the New FRMP on a Change
    Request that is at one of the following status points: Requested, Objected, or Pending Validation.'
- term: RoLR Key Contact
  definition: A contact specified in the NEM Retail Operations Contacts List.
- term: RoLR Post Implementation Review
  definition: A review managed by AEMO to assess how a RoLR Event was managed.
- term: RoLR Transition Period
  definition: The period of time from when a RoLR Event occurs to the time a RoLR Post Implementation Review is
    complete.
- term: Rooftop PV
  definition: A system comprising 1 or more photovoltaic (PV) panels installed on a residential or commercial rooftop,
    converting sunlight to electricity. The capacity of these systems is less than 100 kilowatts (kW)
- term: Routine Testing
  definition: For the purposes of the Metrology Procedure, includes the ongoing and regular maintenance testing,
    compliance testing and in-service testing of a metering installation initiated by the MC or MP to fulfil their
    obligations under clause S7.3 of the NER.
- term: RP
  definition: Responsible Person. The participant with formal responsibility for the provision, installation and
    maintenance of a metering installation.
- term: RPO
  definition: Reactive Plant Operator; Generators and Network Service Providers (NSPs) operating reactive plant
    in accordance with reactive plant dispatch instructions from the AEMO control centres.
- term: RPP
  definition: Renewable Power Percentage
- term: RRN
  definition: Regional Reference Node. Reference point (or designated reference node) for setting a region’s spot
    price.
- term: RRO
  definition: Retailer Reliability Obligation
- term: RRP
  definition: Region Reference Price. Spot price at the regional reference node in $/MWh (exclusive of GST).
- term: RSF
  definition: Regional Scaling Factor
- term: RTO
  definition: NEM Real Time Operations
- term: Rules
  definition: The National Gas or Electricity rules.
- term: Run period
  definition: The run period is the period of time between the declaration deadline and the beginning of the next
    quarter.
- term: SAM
  definition: System Access Management
- term: Sample Test Plan
  definition: A statement of the sample size to be taken, the frequency of sample testing, and the required accuracy.
- term: SAPS
  definition: Standalone Power Systems
- term: SBDU
  definition: Small Bidirectional Unit
- term: SCADA
  definition: Supervisory Control and Data Acquisition. A system that gathers real-time data from remote terminal
    units and other communication sources in the field and enables operators to control field devices from their
    consoles.
- term: SCADA Local Limit
  definition: Same as upper MW limit.
- term: Scheduled Load
  definition: See Relevant Rules or Procedures
- term: Scheduled Meter Reading
  definition: An Actual Meter Reading on a Meter Reading date scheduled by the relevant MDP.
- term: Scheduled Network Service
  definition: See Relevant Rules or Procedures
- term: Scheduled Reading Date
  definition: The date on which a Scheduled Meter Reading has occurred or might occur.
- term: Schema
  definition: See aseXML Schema.
- term: SDC
  definition: Semi-scheduled Dispatch Cap
- term: SDPC
  definition: Supply and Demand Point Constraints. Contractual, physical and operating limits at system injection
    or withdrawal points external to Victoria’s Declared Transmission System (DTS). These are applied to both pricing
    schedules and operating schedules.
- term: SDQ Reports
  definition: Standing Data Quality Reports
- term: SEA Gas
  definition: South East Australia Gas Pipeline. A number of transmission pipelines operating across South Australia.
- term: Second-Tier Controlled Load
  definition: A Controlled Load that is a second-tier load.
- term: Second-Tier Non-Controlled Load
  definition: A Non-Controlled Load that is a second-tier load.
- term: Second Tier Customer
  definition: End use customers who have transferred to a retailer other than their local retailer.
- term: Second Tier NMI
  definition: The electricity associated with a second tier NMI is purchased from a retailer other than the local
    retailer.
- term: Selected days
  definition: The most recent 10 qualifying days within the baseline window. If fewer than 10 qualifying days exist
    but five or more qualifying days exist, then use the number of qualifying days available. If fewer than five
    qualifying days are available, then a process to manage this outcome is required.
- term: Self-accreditation
  definition: Stage 1 and stage 2 self-accreditation testing
- term: Self-forecast
  definition: Participant’s 5-minute ahead dispatch self-forecast of unconstrained intermittent generation from
    a semi-scheduled generating unit
- term: Semi-scheduled Generating System
  definition: See Relevant Rules or Procedures
- term: Semi-scheduled Generating Unit
  definition: See Relevant Rules or Procedures
- term: Semi-scheduled Generator
  definition: See Relevant Rules or Procedures
- term: Sent out
  definition: Electricity supplied to the grid by scheduled, semi-scheduled, and significant non-scheduled generators,
    excluding their auxiliary loads, or electricity used by a generator
- term: SEQ
  definition: South-East Queensland eastern section of the Roma to Brisbane Pipeline
- term: Service Level Procedure (ENM)
  definition: 'The Service Level Procedure: Embedded Network Managers.'
- term: Service Level Procedure (MDP)
  definition: 'The Service Level Procedure: Metering Data Provider Services. Details the requirements for the systems
    and processes for the collection, processing, and delivery of metering data by Metering Data Providers.'
- term: Service Level Procedure (MP)
  definition: 'The Service Level Procedure: Metering Provider Services Category B for Metering installation Types
    1, 2, 3, 4, 5 and 6. Details the requirements for the provision, installation, and maintenance of metering installations
    by Metering Providers.'
- term: Service Order
  definition: 'A request to perform specified work, see B2B Procedures: Service Order Process.'
- term: Service Order Process
  definition: 'The process of requesting the performance of specified work and receiving notification of the outcome
    of the request, see B2B Procedures: Service Order Process.'
- term: Service Order Request
  definition: 'A request made by a retailer to a service provider for a defined service to be performed at a connection
    point, see B2B Procedures: Service Order Process.'
- term: Service Order Response
  definition: A B2B Communication in response to a Service Order Request that includes an explanation if the work
    is incomplete.
- term: Service Paperwork
  definition: 'Paperwork required to carry out certain Service Order Requests. For example: electrical work request
    or certificate of electrical safety.'
- term: Service Provider
  definition: When used in a B2B Procedure, refers to the DNSP, MDP, or MPB.
- term: Service Provider Reference
  definition: The Facility Operator’s reference number for the agreement between themselves and Shippers for Capacity
    Trading.
- term: Service Reference
  definition: The Facility Operator’s reference number for the agreement between themselves and Shippers for capacity
    trading.
- term: Service Types
  definition: Energy, FCAS, and MNSP
- term: Service Types - FCAS
  definition: RAISE6SEC, RAISE60SEC, RAISE5MIN, RAISEREG, LOWER6SEC, LOWER60SEC, LOWER5MIN and LOWERREG
- term: Set Participant
  definition: Where a Participant User has user rights assigned by more than one participant ID, the Participant
    User can select the participant ID they want to represent using the Set Participant option in the web portals.
- term: Settlement Calendars
  definition: AEMO prepares a settlement calendar for each of the markets being settled, showing the dates for delivery
    of statements and settlement of trading amounts relating to each billing period
- term: Settlement Residue
  definition: See Relevant Rules or Procedures
- term: Settlement Residue Auction (SRA)
  definition: Settlement Residue Auction. Auctions run by AEMO to sell the rights to the settlements residue associated
    with inter-regional transfers. Only certain classifications of participants are able to participate in the auctions.
- term: Settlement Residue Distribution Agreement
  definition: See Relevant Rules or Procedures
- term: Settlement run type
  definition: 'There are four settlement run types: Initial, Final, Revision and Adjustment.'
- term: Settlements
  definition: See Relevant Rules or Procedures
- term: Settlements Amount
  definition: See Relevant Rules or Procedures
- term: SGA
  definition: Small Generator Aggregator
- term: SGU
  definition: Scheduled Generating Unit. A generating unit with a nameplate rating of 30MW or greater. Note that
    a group of generating units with a combined nameplate rating of 30MW or greater is also classified as a Scheduled
    Generating Unit.
- term: Shared Market Protocol
  definition: 'An initiative to provide a standard for communications to support smart meters. AEMO has extended
    AEMO’s e-Hub functionality to support this initiative in line with the B2B Procedure: Technical Delivery Specifications.'
- term: Shippers
  definition: See Relevant Rules or Procedures
- term: Single User ID Login
  definition: The ability to switch between different participant IDs, without having to log out, change the ID
    and password, and log in again. See Setting up Single User IDs.
- term: Site
  definition: 'The physical location of the connection point, see B2B Procedures: Customer and Site Details and
    Service Orders Process.'
- term: Small Resource Aggregator (SRA)
  definition: Small Resource Aggregator
- term: SOC
  definition: State of Charge, energy availability of batteries (in MWh)
- term: SOC (actual)
  definition: Initial Energy Storage at the start of a Trading Interval (TI)
- term: SOC (calculated)
  definition: Calculated State Of Charge is the Energy Storage value at the end of a Trading Interval (TI)
- term: SOMMS
  definition: System Outlook for the Market Management System
- term: SP
  definition: Service Provider (could be different to meter data providers). They provide the telemetry data i.e.
    behind the NMI data from Batteries.
- term: SPC
  definition: System Performance and Commercial team within AEMO Operations
- term: Special Meter Reading
  definition: An Actual Meter Reading taken on a date other than a Scheduled Reading Date.
- term: Special Read Date
  definition: A date when a Special Meter Reading is to occur.
- term: Spot Market
  definition: See National Electricity Rules
- term: Spot Market Transactions
  definition: See Relevant Rules or Procedures
- term: SRA
  definition: Small Resource Aggregator
- term: SRA Agents
  definition: See Relevant Rules or Procedures
- term: SRA Auction
  definition: See Relevant Rules or Procedures
- term: SRA Auction Participants
  definition: See Relevant Rules or Procedures
- term: SRAS
  definition: System Restart Ancillary Service. The set of contracted restart services procured by AEMO to facilitate
    the supply of sufficient energy to enable the orderly restart of other (large) generating units.
- term: SRDA
  definition: See Relevant Rules or Procedures
- term: SREC
  definition: Small Renewable Energy Certificate
- term: SSL
  definition: Secure Socket Layer, a protocol for encrypting information over the internet.
- term: ST PASA
  definition: Short Term Projected Assessment of System Adequacy. A daily load forecast that shows expected demand
    two to seven days ahead of time.
- term: Start Date
  definition: The date the change occurs.
- term: Static GELF parameters
  definition: 'Information listed at the top of each Station or Reservoir Data Entry interface. For example:  power
    station name  category  classification  scheme Static GELF parameters are entered by AEMO and are read-only.
    If there are any errors or discrepancies in your static GELF parameters, please send an e-mail with the correct
    information to: gelf@aemo.com.au.'
- term: Stopfile
  definition: When the number of unacknowledged outbound files in your Participant Outbox exceeds the upper or lower
    limit, a Stopfile is imposed on your Participant Outbox Transactions. Once imposed no more processing on inbound
    or outbound Transactions occurs until the file numbers fall below the Lower Limit.
- term: STPASA
  definition: Short-term Projected Assessment of System Adequacy. 30 minute resolution, seven days ahead. A daily
    load forecast showing expected demand two to seven days ahead of time.
- term: Structured Address
  definition: 'The structured address format containing the following information: • Flat type and flat number •
    Floor type and floor number • Building name • Location descriptor • House number and suffix • Lot number • Street
    name and street type • Suburb • Postcode • State'
- term: STTM
  definition: Short Term Trading Market. A wholesale market that facilitates short-term gas trading between gas
    shippers and users. STTM hubs operate in Adelaide, Brisbane and Sydney.
- term: Study period
  definition: The 24-month period after the GELF declaration submission deadline.
- term: Submission
  definition: 'A Bid/Offer submission can have: 1. Multiple Trading Days 2. Multiple DUIDs/LinkIDs 3. All Service
    Types in the same Submission'
- term: Submission Cut-off Date
  definition: The submission cut-off date in respect of a gas day is 9.00 am on the 14th business day after the
    end of the billing period in which that gas day falls. After that time, reallocation request submissions and
    authorisations for that gas day are no longer accepted.
- term: Submitter
  definition: The party submitting a delivered quantity transaction.
- term: Substitution
  definition: A process undertaken for the replacement of missing (null) or erroneous accumulated metering data
    or interval metering data where metering data has failed Validation.
- term: Successful Auction Participant
  definition: See Relevant Rules or Procedures
- term: Super User Right
  definition: System administrator right only assigned to AEMO system administrators.
- term: Superseded
  definition: The participant can receive files compliant to the The participant can receive files compliant to
    the superseded aseXML version, and needs to change over their receiving system before the next aseXML version
    release.
- term: Swagger file
  definition: Refers to the OpenAPI specification
- term: SWIS
  definition: South West Interconnected System. The power system that supplies electricity to south-west Western
    Australia.
- term: SWP
  definition: South West Pipeline. A pipeline facilitating gas flows from Victoria to South Australia.
- term: SWQP
  definition: South West Queensland Pipeline. A natural gas transmission pipeline from Ballera to Wallumbilla.
- term: System Administrator
  definition: The AEMO system administrator who sets up participant administrators and maintains Participant ID
    access.
- term: T1
  definition: Fast Start Time at Zero in minutes. Only relevant to Service type, Energy. For a fast start unit,
    this is the time to synchronise. For a wholesale demand response unit, this is the time to start (prepare) responding.
- term: T2
  definition: Fast Start Time to Minimum Load in minutes. Only relevant to Service type, Energy.
- term: T3
  definition: Fast Start Time at Minimum Load in minutes. Only relevant to Service type, Energy.
- term: T4
  definition: Only relevant to Service type, Energy. Fast Start Time to Zero in minutes.
- term: TA
  definition: Typical Accural
- term: Tariff V
  definition: Residential and small-to-medium-sized commercial users consuming less than 10 TJ of gas per year
- term: TBC
  definition: To be confirmed
- term: Technical Delivery Specification
  definition: 'The B2B Procedures: Technical Delivery Specification. Defines the technical requirements for communicating
    B2B messages between participants using the MSATS B2B Handler or contingency systems.'
- term: Technical Guidelines
  definition: 'Refers to the B2B Procedures: Technical Guidelines for B2B Procedures.'
- term: TGP
  definition: Tasmanian Gas Pipeline. A pipeline supplying national gas from Longford in Victoria, under the Bass
    Strait, to Bell Bay in Tasmania.
- term: THD
  definition: Total Harmonic Distortion. A measurement used in power systems of how much of the distortion of a
    voltage or current is due to harmonics in the signal.
- term: Throttling
  definition: AEMO uses API throttling to prevent overwhelming the API Gateway.
- term: TI
  definition: Trading Interval. A period of time prescribed in both the National Electricity Rules and National
    Gas Rules for the wholesale exchange.
- term: Tier 1 Site
  definition: 'A site where the FRMP is the LR. This could be the case where: • The End Use Customer has transferred
    back to the LR as their retailer (FRMP) after a period with another retailer. • The site is not contestable.
    • The site is contestable but the End Use Customer has not transferred to another retailer. See also first-tier
    controlled load.'
- term: Tier 2 Site
  definition: 'A site where the FRMP is not the same as the LR. This could be the case if: • A contestable End Use
    Customer has elected to transfer from the LR. • An End Use Customer signed a contract with a retailer other
    than the LR prior to the connection point being established in the MSATS System and it was created as a Tier
    2 Site. See also second-tier controlled load.'
- term: Time Frame Rules
  definition: 'As described in the CATS Procedures, the rules allocating the number of business days to the following
    categories: • Objection Logging Period. • Objection Clearing Period. • Retrospective Period. • Prospective Period.'
- term: Timing Period
  definition: Period between two timing points.
- term: Timing Point
  definition: Point in time when an activity occurs.
- term: Timing Requirement
  definition: The Timing Points when an activity must be initiated or completed.
- term: TLF
  definition: Transmission Loss Factor. A calculation that ensures customers aren’t charged for the electricity
    that is lost in transit over poles and wires.
- term: TNI
  definition: Transmission Node Identifier. The code the relevant transmission node that identifies the transmission
    loss factor and/or transmission use of system charge for the connection point.
- term: TNI Code
  definition: 'Transmission Node Identity: A four character alpha-numeric code used to identify a virtual transmission
    node or transmission network connection point.'
- term: TNSP
  definition: Transmission Network Service Provider. A party that owns, controls or operates a transmission system.
- term: Trade
  definition: Future Transfer Submission having 1 sell and 1 buy with a matching Gas Future ID
- term: Trader
  definition: See Relevant Rules or Procedures
- term: Trading Amount
  definition: The resulting positive or negative dollar amount of a Reallocation
- term: Trading Date
  definition: Equivalent to a trading day under the Rules.
- term: Trading Day
  definition: See Relevant Rules or Procedures
- term: Trading Interval
  definition: See Relevant Rules or Procedures
- term: Trading Margin
  definition: See Relevant Rules or Procedures
- term: Trading Participant
  definition: See National Gas Rules
- term: Trading Window
  definition: See Relevant Rules or Procedures
- term: Tranche
  definition: SRA procedures term
- term: Transaction
  definition: See Relevant Rules or Procedures
- term: Transaction Acknowledgement
  definition: An aseXML realisation of a business acceptance/rejection.
- term: Transaction Group
  definition: 'The transaction group field in an aseXML Message, see B2B Procedures: Technical Delivery Specification.'
- term: Transaction Message
  definition: An aseXML realisation of a business document.
- term: Transaction Model
  definition: The physical exchange of B2B messages to complete a B2B interaction.
- term: Transaction Priority
  definition: An element in an aseXML message allowing the sender to indicate their preference in terms of timeliness
    of processing for the message contents. The three allowable values are “High”, “Medium” and “Low”. As used in
    terms such as Medium Priority or Low Priority.
- term: Transaction Type Code
  definition: As described in the CATS Procedures, a code used in MSATS to identify a need to change CATS Standing
    Data.
- term: Transaction types
  definition: Exchange or Delivery
- term: Transfer
  definition: Future Transfer Submission
- term: Transmission Lines
  definition: See National Electricity Rules
- term: Transmission Loss Factor
  definition: See Relevant Rules or Procedures
- term: Transmission Network Service Provider
  definition: See Relevant Rules or Procedures
- term: TUOS
  definition: Transmission Use of System Charge. Charge levied by transmission asset owners to recover costs for
    the provision of shared network services.
- term: Typical Accrual
  definition: See Relevant Rules or Procedures
- term: UAFG
  definition: Unaccounted For Gas. The difference between the measured quantity of gas entering the gas distribution
    system from various supply points and the gas delivered to customers.
- term: UAM
  definition: Uniform Allocation Method
- term: UFE
  definition: Unaccounted For Energy. The difference between metered injected gas supply, and metered and allocated
    gas at delivery points, it comprises gas losses, metering errors, timing, heating value error, allocation error,
    and other factors.
- term: UGS
  definition: Underground Gas Storage. A storage plant that pumps excess supply underground, so that the gas can
    then be extracted for later use.
- term: UIGF
  definition: Unconstrained Intermittent Generation Forecast. A forecast of available capacity for wind and solar
    generating units for the period five minutes to two years ahead.
- term: UMCP
  definition: Unmetered Connection Point. Connection points, such as street lights and traffic lights, that don’t
    need an electricity meter because the usage is predictable and can be calculated without a meter.
- term: Unadjusted baseline energy
  definition: For a trading interval, the average metered values for the corresponding trading interval on each
    of the selected days.
- term: Uncontrolled Unmetered Device
  definition: An Unmetered Device operating 24 hours per day and has a variable load over a repeated operating cycle
    (e.g. traffic signal, where applicable).
- term: Unit
  definition: A Scheduled, Semi-Scheduled, or Non-Scheduled Generating Unit
- term: Unit Category
  definition: See Relevant Rules or Procedures
- term: Unit ID
  definition: A semi-scheduled generating unit or a non-scheduled generating unit
- term: Unit State
  definition: A Scheduled Generating Unit’s availability or unavailability and the reason for it
- term: Unit State Code
  definition: The code representing the Unit State
- term: Units
  definition: See Relevant Rules or Procedures
- term: Unmetered Device
  definition: 'Any electricity-consuming device installed at or near a connection point that is unmetered, and the
    load consumed at that connection point is a market load. There are two types of Unmetered Devices: Controlled
    Unmetered Devices and Uncontrolled Unmetered Devices.'
- term: Unmetered Load Guideline
  definition: Guidelines for unmetered loads.
- term: Unmetered Supply
  definition: The consumption volume calculated for loads that have no meter (e.g. street lighting etc). Unmetered
    metering data for unmetered supply is submitted to MSATS as interval data (i.e. as if it was an interval type
    of metering installation).
- term: Unstructured Address
  definition: 'Deprecated from: May 2023 An address with the following format: • A string of text characters with
    a maximum length of 80 per line. • A maximum of 3 lines.'
- term: Update Privilege
  definition: The access right to update records represented by an entity.
- term: Upper MW Limit
  definition: MW Limit restriction, indicating when a facility is down regulated. An MW limit is applied in the
    Unit’s control system to limit its MW output to below maximum capacity.
- term: URM
  definition: User Rights Management; see the Guide to URM on AEMO's website
- term: Usage Factor
  definition: The method of identifying a given data stream’s consumption in terms of its contribution to the overall
    sum of profile loads for a given date range.
- term: Usage Payment
  definition: A payment to compensate the Provider for costs of operating in the manner required to provide the
    relevant system security service.
- term: USE
  definition: Unserved Energy. The amount of energy that cannot be supplied because there is insufficient generation
    capacity, demand-side participation, or network capability to meet demand.
- term: User Right
  definition: Rights are a collection of entities and their associated access privileges. A right consists of information
    about various actions that an owner of a right can perform on each entity in the system. PAs can create and
    edit rights and allocate them to participant users in their company.
- term: User Rights Access
  definition: The Right a PA assigns to Participant Users to allow access to different areas of AEMO's market systems.
- term: Validated
  definition: Metering data that has passed Validation.
- term: Validation
  definition: A process to test the veracity and integrity of metering data.
- term: VAPR
  definition: Victorian Annual Planning Report. A plan that considers the adequacy of the Victorian transmission
    network to meet its reliability and security requirements, and identifies development opportunities to address
    emerging network limitations.
- term: VAr
  definition: Volt-Ampere reactive power, relating to voltage control in the power system
- term: Variable GELF parameters
  definition: 'GELF declarations entered into the Station or Reservoir Data Entry interface grids. Variable GELF
    parameters are the GELF declarations entered by participants. For example: Station declarations:  Inflexible
    Outages  Energy or capacity capability subject to GELF Reservoir declarations:  Initial and monthly reservoir
    limits  Inflows by rainfall scenarios.'
- term: VCR
  definition: Value of Customer Reliability. Represents a customer's willingness to pay for the reliable supply
    of electricity.
- term: VDS
  definition: VAr Dispatch Scheduling; the system that produces instructions for reactive plant
- term: VEEC
  definition: Victorian Energy Efficiency Certificate
- term: VFFCAS
  definition: Very Fast FCAS
- term: VGPR
  definition: Victorian Gas Planning Report. A plan providing an assessment of supply and demand, and pipeline capacity
    adequacy for the Victorian Declared Transmission System (DTS) over the next five years.
- term: VICAMI Meter
  definition: A meter installed in Victoria as part of the Advanced Metering Infrastructure mandate.
- term: VoLL
  definition: Value of Lost Load. A monetary indicator expressing the costs associated with an interruption of electricity
    supply.
- term: Voltage
  definition: See National Electricity Rules
- term: VPN
  definition: Virtual Private Network
- term: VPP
  definition: Virtual Power Plant. An aggregation of resources, coordinated using software and communications technology
    to deliver services that have traditionally been performed by a conventional power plant. In Australia, grid-connected
    VPPs are focused on coordinating rooftop photovoltaic (PV) systems and battery storage.
- term: VRE
  definition: Variable Renewable Energy. Renewable energy that fluctuates, such as solar or wind.
- term: VSR
  definition: Voluntarily Scheduled Resource
- term: VSRP
  definition: A VSRP must be the Financially Responsible Market Participant (FRMP) for the NMIs it is nominating
    into VSRs.
- term: VT
  definition: Voltage transformer
- term: WA GBB
  definition: Western Australia Gas Bulletin Board (WA). A public website that publishes forecast and historical
    data on the domestic production, transmission, storage and usage of natural gas in WA.
- term: WA GSOO
  definition: Western Australia Gas Statement of Opportunities (WA). An annual report that provides forecasts of
    WA domestic gas demand and potential supply over a 10-year period, including an overview of gas infrastructure
    and emerging issues.
- term: WAL
  definition: Wallumbilla spread product
- term: WAL Product
  definition: The single trading location in the Gas Supply Hub (GSH).
- term: Wallumbilla
  definition: See Relevant Rules or Procedures
- term: WCP
  definition: Wholesale Connection Point
- term: WDR
  definition: Wholesale Demand Response
- term: WDRM
  definition: Wholesale Demand Response Mechanism
- term: WDRU
  definition: Wholesale Demand Response Unit
- term: Web Services
  definition: The transfer of aseXML transactions between participant gateways and the AEMO's market systems.
- term: Weekly Energy Limit
  definition: Weekly energy constraints submitted by participants, as described in clause 3.7.2(d)(2) of the National
    Electricity Rules, the NER glossary, and the MT PASA process description.
- term: WEM
  definition: Wholesale Electricity Market (WA). A wholesale electricity market supplying energy to south-west Western
    Australia. It operates on the South West Interconnected System (SWIS).
- term: WEMS
  definition: Wholesale Electricity Market System. The IT interface used to administer the Wholesale Electricity
    Market (WEM).
- term: Wholesale Connection Point
  definition: Connection points located at the transmission node representing bulk supply feeders to a distribution
    network, interconnectors, and generation points.
- term: Wholesale settlement day
  definition: A period of time constituting a day for the purposes of wholesale settlement. It is a 24 hour period
    beginning and ending at midnight Australian Eastern Standard Time (AEST).
- term: WIGS Procedures
  definition: 'MSATS Procedures: Procedure for the Management of Wholesale, Interconnector, Generator and Sample
    (WIGS) NMIs.'
- term: WTS
  definition: Western Transmission System. Transports gas to Portland, Hamilton and Cobden.
- term: XML
  definition: eXtensible Mark-up Language.
- term: Zip
  definition: A compressed file, with the zip extension. A zip file usually contains one file with a filename extension
    of XML or csv.
- term: Zone
  definition: The term ‘Zone’ refers to boundaries within which the connection points of a single VSR must be contained.
    Determination of zonal aggregation requirements will be undertaken as part of IPRR procedure development.
