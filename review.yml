actions:
  openapiHarvested: true
  openapiCount: 76
  openapiCountProviderAuthored: 74
  openapiCountStandardsBody: 2
  openapiTotalDeclaredPaths: 22
  openapiTotalDeclaredPathsFromAemo: 0
  apisListed: 77
  apisYmlCreated: true
  reason: >-
    AEMO is the control case this study needed, and it answers the question in the
    negative. Australia proved a statutory data mandate is transplantable — the Consumer
    Data Standards energy schemas exist, AEMO conforms to them, and the gateway is live
    behind a real certificate. It also proved that transplanting the mandate does not
    transplant the outcome. What made banking legible was an anonymous, self-describing,
    standards-identical endpoint at every data holder. Energy has no such thing: the
    gateway's endpoints are mTLS-only, the accredited recipient is architecturally
    forbidden from calling them, and the operator's 74 published OpenAPI documents contain
    zero operations between them. And the surface that IS open — 171 directories of
    dispatch, price and settlement data, plus a live five-minute JSON feed — was never
    mandated by the CDR at all. It exists because a spot market needs transparency to
    clear. Openness here is a market-design artefact, not a regulatory one.
