  of planned IT changes and change windows) and through Market Notices filtered to MARKET SYSTEMS. What the API
  platform itself exposes is the live version inventory: every API is registered in Azure API Management inside
  a version set, and superseded versions stay published alongside their replacements. That inventory is captured
  below as the closest machine-readable record of API evolution AEMO makes available.'
