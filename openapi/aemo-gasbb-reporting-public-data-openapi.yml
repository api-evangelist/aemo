  version: v1
  x-origin:
  - format: openapi
    version: '3.0'
    source: AEMO API Management developer portal
    url: https://dev.aemo.com.au/developer/apis/gasbb-reporting-public-data/operations?api-version=2022-04-01-preview
servers:
- url: https://api-prd.aemo.local/gasbb-reporting-data
paths:
  /linepackCapacityAdequacy:
    post:
      operationId: adhocReportForLinepackCapacityAdequacy
      summary: Adhoc report for Linepack Capacity Adequacy
      tags:
      - GasBB Reporting Public Data
      description: Provides a report for the Linepack Capacity Adequacy for each Pipeline for the current
        and next 2 gas days (D to D+2). The report can be filtered to reduce data output.
      parameters:
      - name: FacilityIds
        in: query
        required: false
        schema:
          type: integer
        description: A unique AEMO defined Facility identifier
      - name: GasDate
        in: query
        required: false
        schema:
          type: string
        description: Date of gas day. Timestamps are ignored. The gas day as defined in the pipeline contract
          or market rules.
      responses:
        '200':
          description: Successful reponse with Linepack Capacity Adequacy report
          content:
            application/json:
              example:
                transactionId: d715de25-813f-4fb8-9b4a-944f41c05ba5
                data:
                  LinepackCapacityAdequacyList:
                  - GasDate: '2018-11-30T02:00:00Z'
                    FacilityId: 530038
                    FacilityName: APLNG Pipeline
                    Flag: GREEN
                    Description: All OK
                    LastUpdated: '2018-11-30T11:50:45Z'
                  - GasDate: '2018-12-01T02:00:00Z'
                    FacilityId: 530038
                    FacilityName: APLNG Pipeline
                    Flag: GREEN
                    Description: All OK
                    LastUpdated: '2018-11-30T11:50:45Z'
                  - GasDate: '2018-11-30T02:00:00Z'
                    FacilityId: 530038
                    FacilityName: APLNG Pipeline
                    Flag: GREEN
                    Description: All OK
                    LastUpdated: '2018-11-30T11:50:45Z'
                errors: []
                warnings: []
        '400':
          description: The service cannot be found for the endpoint reference (EPR) <URI>
          content:
            application/json:
              example:
                Fault: SystemMessageExceptionDump
        '401':
          description: This response is provided when "Authorisation" is missing from the header OR user/password
            is incorrect/not provided OR user account is locked out.
          content:
            application/json:
              example:
                Exception: Unauthorized:Invalid UserName or Password
        '403':
          description: This response is provided when there is an invalid Role i.e. user does not have
            permission to submit this request.
        '404':
          description: This response is provided when the resource missing from URL or incorrect.
          content:
            application/json:
              example:
                Exception: 'Resources for the endpoint URI not found. Endpoint URI: <Resource>'
        '405':
          description: Invalid Method used (e.g. GET used instead of POST)
          content:
            application/json:
              example:
                Exception: 'Input request HTTP method is <Invalid Method passed> but operation <Resource
                  Name> accepts only: [<Valid Method>]'
        '411':
          description: This response is provided when "Content-Length" is missing from the Header
        '422':
          description: This response is provided when any there are any Business validation failures,
            then entire submission is rejected.
          content:
            application/json:
              example:
                data: {}
                errors:
                - code: 73
                  title: InvalidBuySell
                  detail: BuySell value 24.1 is not valid
                  source: ''
        '429':
          description: This response is provided when the throttling limits are reached.
        '500':
          description: e-Hub is operational but downstream systems are not available.
          content:
            application/json:
              example:
                Exception: Application Unavailable
        '503':
          description: e-Hub is operational but downstream systems are not available.
          content:
            application/json:
              example:
                Exception: Application Unavailable
