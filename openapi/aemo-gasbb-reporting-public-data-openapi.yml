  /nameplateRating:
    post:
      operationId: adhocReportForStandingNameplateCapacity
      summary: Adhoc report for standing nameplate capacity
      tags:
      - GasBB Reporting Public Data
      description: This report displays the standing nameplate capacity of all BB facilities and transitional
        compression facility. Nameplate rating relates to maximum daily quantities in TJ under normal
        operating conditions.
      parameters:
      - name: EffectiveDate
        in: query
        required: false
        schema:
          type: string
        description: Gas day date that corresponding record takes effect. Any time component supplied
          will be ignored.
      - name: CapacityTypes
        in: query
        required: false
        schema:
          type: string
          enum:
          - STORAGE
          - MDQ
        description: "Capacity type values can be -\n\nSTORAGE — Holding capacity in storage; \n\nMDQ\
          \ — Daily maximum firm capacity under the expected operating conditions."
      - name: FacilityIds
        in: query
        required: false
        schema:
          type: integer
        description: A unique AEMO defined Facility identifier
      - name: FacilityTypes
        in: query
        required: false
        schema:
          type: string
        description: Facility type associated with the Facility Id.
      - name: FlowDirections
        in: query
        required: false
        schema:
          type: string
          enum:
          - RECEIPT
          - DELIVERY
          - 'null'
        description: "Gas flow direction. Values can be either- \nRECEIPT — A flow of gas into the BB\
          \ facility\n\nDELIVERY — A flow of gas out of the BB facility.\n\nNONE – will be displayed for\
          \ all other BB facilities and transitional compression facilities."
      responses:
        '200':
          description: Successful reponse with standing nameplate capacity report
          content:
            application/json:
              example:
                transactionId: ff6f1b62-7932-4df7-b527-e306115e407g
                data:
                  NameplateRatingList:
                  - FacilityId: 530043
                    FacilityName: APLNG Pipeline
                    FacilityType: PIPE
                    CapacityType: MDQ
                    CapacityQuantity: '1560.321'
                    FlowDirection: NONE
                    CapacityDescription: ' This transmission capacity is the amount of gas that the Culcairn
                      delivery point is able to withdraw from this pipeline facility'
                    ReceiptLocation: 1808012
                    DeliveryLocation: 1300405
                    EffectiveDate: '2018-09-03T02:00:00Z'
                    Description: increase in nameplate pipeline capacity due to completion of VNIE Phase
                      B
                    LastUpdated: '2020-06-01T01:18:21Z'
                errors: []
                warnings: []
        '400':
          description: The service cannot be found for the endpoint reference (EPR) <URI>
          content:
            application/json:
              example:
                Fault: SystemMessageExceptionDump
        '401':
          description: This response is provided when "Authorisation" is missing from the header OR user/password
            is incorrect/not provided OR user account is locked out.
          content:
            application/json:
              example:
