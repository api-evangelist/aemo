openapi: 3.0.1
info:
  title: CapacityAuction
  description: '

    ## Introduction

    The Capacity Auction API is used by facility operators and trading participants to submit and receive
    data relating to capacity trades and day ahead auction for AEMO’s Capacity Transfer Platform (CTP)
    and Day-Ahead Auction (DAA) market systems.


    For details on how to get access and business rules for this API:


    <a href="/api-docs"><img src="./files/ViewAPIDocsButton.png" alt="View API Docs" /></a>'
  version: v1
  x-origin:
  - format: openapi
    version: '3.0'
    source: AEMO API Management developer portal
    url: https://dev.aemo.com.au/developer/apis/capacityAuction-v1/operations?api-version=2022-04-01-preview
servers:
- url: https://api-prd.aemo.local/ws/gsh/capacityAuction
paths:
  /GasFuture:
    get:
      operationId: getGSHFutureData
      summary: Get GSH future data
      tags:
      - CapacityAuction
      description: Allows auction participants to retrieve GSH Physical Gas Future Data
      parameters:
      - name: X-initiatingParticipantID
        in: header
        required: true
        schema:
          type: string
        description: The ID of the Initiating Participant
      - name: X-market
        in: header
        required: false
        schema:
          type: string
        description: The market type that the request applies.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success response with future data
          content:
            application/json:
              example:
                transactionId: 296432aa-7cc6-43e5-b611-0c8cbd092748
                data:
                  CallSuccessful: true
                  CallResponseMessage: GSH Physical Gas Future Data Request completed.
                  ItemList:
                  - MarketId: GSH
                    RecordId: 33983
                    ParticipantId: '2012'
                    GasFutureId: ASX-AEMO-DEMO-344
                    ProductGroupCode: GAS-WAL
                    ProductTypeCode: Gas - NG Months
                    DeliveryPoint: WAL HP Trade Point
                    StartDate: '2022-07-01T12:00:00Z'
                    EndDate: '2022-07-31T12:00:00Z'
                    TradeType: BUY
                    Price: 3
                    Volume: 4
                    TradeValue: 12
                    Status: PENDING
                    ValidationMsg: ''
                    SubmittedTime: '2022-06-07T10:56:37Z'
                    LastChanged: '2022-06-07T10:56:37Z'
                  - MarketId: GSH
                    RecordId: 33982
                    ParticipantId: '2012'
                    GasFutureId: ASX-AEMO-DEMO-344
                    ProductGroupCode: GAS-WAL
                    ProductTypeCode: Gas - NG Months
                    DeliveryPoint: WAL HP Trade Point
                    StartDate: '2022-07-01T12:00:00Z'
                    EndDate: '2022-07-31T12:00:00Z'
                    TradeType: BUY
                    Price: 3
                    Volume: 4
                    TradeValue: 12
                    Status: OVERRIDE
                    ValidationMsg: ''
                    SubmittedTime: '2022-06-07T12:20:07Z'
                    LastChanged: '2022-06-07T10:56:37Z'
                errors: []
        '400':
          description: The service cannot be found for the endpoint reference (EPR) <URI>
          content:
            application/json:
              example:
                Fault: <SystemMessageExceptionDump>
        '401':
          description: This response is provided when "Authorisation" is missing from the header OR user/password
            is incorrect/not provided OR user account is locked out.
          content:
            application/json:
              example:
                Exception: Unauthorized:Invalid UserName or Password
        '403':
          description: This response is provided when there is an invalid Role i.e. user does not have
            permission to submit this request.
        '404':
          description: This response is provided when the resource missing from URL or incorrect.
          content:
            application/json:
              example:
                Exception: 'Resources for the endpoint URI not found. Endpoint URI: <Resource>'
        '405':
          description: Invalid Method used (e.g. GET used instead of POST)
          content:
            application/json:
              example:
                Exception: 'Input request HTTP method is <Invalid Method passed> but operation <Resource
                  Name> accepts only: [<Valid Method>]'
        '411':
          description: This response is provided when "Content-Length" is missing from the Header
        '422':
          description: This response is provided when any there are any Business validation failures,
            then entire submission is rejected.
        '500':
          description: APIM is operational but downstream systems are not available.
          content:
            application/json:
              example:
                Exception: Application Unavailable
        '503':
          description: Exceeds throttling limits OR SSL Certificate authentication validation failed
          content:
            application/json:
              example:
                Exception: 'Service invocation for API was rejected based on policy violation OR Error
                  message: javax.net.ssl.SSLHandshakeException: Received fatal alert: bad_certificate'
  /bidProfile:
