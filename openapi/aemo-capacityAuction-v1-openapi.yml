  /bidProfileSubmission:
    post:
      operationId: submitBidsForTheDayAheadAuction
      summary: Submit bids for the Day Ahead Auction.
      tags:
      - CapacityAuction
      description: "Allows auction participants to submit bids for the Day Ahead Auction.\nMultiple bids\
        \ may be submitted in a single bid profile. However, all bids must pass validation otherwise the\
        \ entire transaction will be rejected.\nThe latest bid profile submission will be used as the\
        \ overall current bidding position for the specified date range.\n\n  A previously submitted bid\
        \ can be cancelled by submitting an empty bid profile for the same gas day."
      parameters:
      - name: X-initiatingParticipantID
        in: header
        required: true
        schema:
          type: string
        description: The ID of the Initiating Participant
      - name: X-market
        in: header
        required: false
        schema:
          type: string
        description: The market type that the request applies.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              ItemList:
                FromGasDate: '2018-05-01T12:00:00Z'
                ToGasDate: '2018-05-02T12:00:00Z'
                Bids:
                - BidId: '2018-05-01T12:00:00Z'
                  Products:
                  - FacilityId: 530001
                    AuctionProductTypeId: BACKHAUL
                    ReceiptPointId: 30001
                    ReceiptPointDWGMCompanyIdReference: 123
                    ReceiptPointDWGMMIRNReference: 200001PC
                    DeliveryPointId: 30002
                    DeliveryPointDWGMCompanyIdReference: 123
                    DeliveryPointDWGMMIRNReference: 200002PC
                    ServiceReference: SR000001
                  Steps:
                  - CumulativeStepQuantity: 123
                    StepPrice: '2032-04-01'
      responses:
        '200':
          description: Successful reponse with Facilites report
          content:
            application/json:
              example:
                Successful reponse with Facilites report - MOCK: ''
        '400':
          description: The service cannot be found for the endpoint reference (EPR) <URI>
          content:
            application/json:
              example:
                Fault: <SystemMessageExceptionDump>
        '401':
          description: This response is provided when "Authorisation" is missing from the header OR user/password
            is incorrect/not provided OR user account is locked out.
          content:
            application/json:
              example:
                Exception: Unauthorized:Invalid UserName or Password
        '403':
          description: This response is provided when there is an invalid Role i.e. user does not have
            permission to submit this request.
        '404':
          description: This response is provided when the resource missing from URL or incorrect.
          content:
            application/json:
              example:
                Exception: 'Resources for the endpoint URI not found. Endpoint URI: <Resource>'
        '405':
          description: Invalid Method used (e.g. GET used instead of POST)
          content:
            application/json:
              example:
                Exception: 'Input request HTTP method is <Invalid Method passed> but operation <Resource
                  Name> accepts only: [<Valid Method>]'
        '411':
          description: This response is provided when "Content-Length" is missing from the Header
        '422':
          description: This response is provided when any there are any Business validation failures,
            then entire submission is rejected.
        '500':
          description: e-Hub is operational but downstream systems are not available.
          content:
            application/json:
