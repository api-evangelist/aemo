      operationId: retrieveASpecificBidProfile
      summary: Retrieve a specific bid profile
      tags:
      - CapacityAuction
      description: Allows auction participants to retrieve a specific bid profile for a given gas date
      parameters:
      - name: GasDate
        in: query
        required: false
        schema:
          type: string
        description: Request date
      - name: SubmittedAt
        in: query
        required: false
        schema:
          type: string
        description: If not supplied, then the latest successful bid submission for each gas date in a
          specified range is returned.
      - name: X-initiatingParticipantID
        in: header
        required: true
        schema:
          type: string
        description: The ID of the Initiating Participant
      - name: X-market
        in: header
        required: false
        schema:
          type: string
        description: The market type that the request applies.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success reponse with report data
          content:
            application/json:
              example:
                transactionId: 27d225a6-6c9a-4081-81dc-eb643fdd2a8f
                data:
                - BidProfileList:
