    get:
      operationId: getAListOfSubmissionsPagedUseTheQueryParametersToRefineAndApplyASearchCriteria
      summary: Get a list of submissions (paged). Use the query parameters to refine and apply a search
        criteria.
      tags:
      - RTMS
      description: 'Retrieves historical submissions based on various parameters. Results are paged with
        default page size of 500 unless specified otherwise. For data older than 35 days of the query
        date the following filters will not be available: GateClosureViolation, Facility, MarketService,
        TradingDay.'
      parameters:
