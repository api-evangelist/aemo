    get:
      operationId: aPIEndpointThatHandlesSearchingTheESSConsolidatedDispatchIntervalsUsingTheProvidedSearchCriteria
      summary: API endpoint that handles searching the ESS consolidated dispatch intervals using the provided
        search criteria.
      tags:
      - RTMS
      description: Retrieves the consolidated view of submissions for a specific Trading Day, Market Service
        and Facility. This endpoint is limited to the ESS Market Services (Regulation Raise/Lower, Contingency
        Raise/Lower, RoCoF) and non-DSP Facilities.
      parameters:
      - name: TradingDay
        in: query
        required: true
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). Returns the consolidated view of submissions
          made for the specified Trading Day (YYYY-MM-DD). The Trading Day can be in the past or in the
          future. Future dates are limited to the Acceptance Horizon window.
      - name: Facility
        in: query
        required: true
        schema:
          type: string
        description: Returns the consolidated view of submissions made for the specified Facility. Facility
          must be a non-DSP Facility
      - name: MarketService
        in: query
        required: true
        schema:
          type: string
          enum:
          - Energy
          - RegulationRaise
          - RegulationLower
          - ContingencyRaise
          - ContingencyLower
          - RoCoF
