    post:
      operationId: createANewDSPSubmissionByEmbeddedTheDSPSubmissionJSONInTheRequestAndWaitForTheValidationToCompleteBlockingCall
      summary: "Create a new DSP submission by embedded the DSP submission JSON in the request and wait\
        \ for the\r\nvalidation to complete (blocking call)."
      tags:
      - RTMS
      description: "Submits one RTM Submission for DSP facilities and wait for the validation response.\
        \ \nThere is a timeout of 30 seconds applied to this endpoint. If the call times out before validation\
        \ process is complete, a submission status of SUBMITTED is returned"
      parameters:
      - name: x-initiatingParticipantId
        in: header
        required: true
        schema:
