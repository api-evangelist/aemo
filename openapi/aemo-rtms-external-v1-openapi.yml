  /gateClosureViolation:
    get:
      operationId: thisResourceListsAllTheDispatchIntervalsSubmittedWithinGateClosureTheDataReturnedCanBeQueriedBasedOnCriteriaSpecifiedByOneOrMoreQueryParameters
      summary: "This resource lists all the Dispatch Intervals submitted within Gate Closure. The data\
        \ returned can be\r\nqueried based on criteria specified by one or more query parameters."
      tags:
      - RTMS
      description: Retrieves a list of Dispatch Intervals submitted within Gate Closure.
      parameters:
      - name: DateTimeFrom
        in: query
        required: false
        schema:
          type: string
        description: Format - date-time (as date-time in RFC3339). Filter the Dispatch Intervals after
          the datetimeoffset (YYYY-MM-DDTHH:mm:ss+08:00) selected submitted within Gate Closure. Defaults
          to 24 hours in the past. Note that when offset is specified, the plus sign '+' must be URL encoded
          to '%2B'. If offset is not specified, it will be treated as +8.
      - name: DateTimeTo
        in: query
        required: false
        schema:
          type: string
        description: 'Format - date-time (as date-time in RFC3339). Filter the Dispatch Intervals up until
          the datetimeoffset (YYYY-MM-DDTHH:mm:ss+08:00) selected submitted within Gate Closure. Defaults
          to now.

          If specified, dateTimeTo must be greater than dateTimeFrom (date component limited to 30 days
          from dateTimeFrom). Note that when offset is specified, the plus sign ''+'' must be URL encoded
          to ''%2B''. If offset is not specified, it will be treated as +8.'
      - name: Facility
        in: query
        required: false
        schema:
          type: string
        description: Filters Gate Closure Violations for the specified Registered Facility.
      - name: MarketService
        in: query
        required: false
        schema:
          type: string
          enum:
          - Energy
          - RegulationRaise
          - RegulationLower
          - ContingencyRaise
          - ContingencyLower
          - RoCoF
        description: 'Filters Gate Closure Violations for the specified Market Service: ''energy'', ''regulationRaise'',
          ''regulationLower'', ''contingencyRaise'', ''contingencyLower'', or ''rocof'''
      - name: x-initiatingParticipantId
        in: header
        required: true
        schema:
          type: string
        description: The id of the Initiating Participant
      - name: x-market
        in: header
        required: true
        schema:
          type: string
        description: The id of the market
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example1:
                  summary: Parameters correctly specified and Gate Closure Violations exist
                  value:
                    transactionId: 703a67b3-3108-41de-93a8-25abfdf7237b
                    data:
                    - submissionId: 6e4140f1-5273-4ea8-ad6b-f782469bfd1d
                      referenceId: GCV_TEST
                      tradingDay: '2021-11-23'
                      dispatchIntervalFrom: '2023-03-23'
                      dispatchIntervalTo: '2023-03-23'
                      participant: PARTICIPANT
                      facility: FACILITY_NAME
                      marketService: ContingencyLower
                      submissionDateTime: '2021-11-23T03:01:34Z'
                      submittedPrice: -10.00,10.00,25.00,35.15,MAX
                      submittedQty: 5.000,5.000,5.000,5.000,3.000
                      uploadedBy: USERNAME
                example2:
