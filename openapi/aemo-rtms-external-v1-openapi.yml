        content:
          application/json:
            example:
              submission:
                standing:
                  comment: string
                  submissionReason: string
                  effectiveTradingDateFrom: string
                  effectiveDispatchIntervalFrom: 0
                  daysOfTheWeek:
                  - dayOfWeek: MON
                    energy:
                      facilities:
                      - facilityCode: string
                        dispatchIntervals:
                        - dispatchIntervalFrom: 0
                          dispatchIntervalTo: 0
                          dspUnconstrainedWithdrawalQuantity: 0
                          dspConstrainedWithdrawalQuantity: 0
                variation:
