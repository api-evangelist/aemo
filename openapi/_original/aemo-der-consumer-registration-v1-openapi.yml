  /initiateLogin:
    get:
      operationId: loginAPI
      summary: Login API
      tags:
      - DER Registration For Account Holders
      description: This API will re-direct the user to the login page where the user can register or login(if
        already registered). After successful login the user will be re-directed to the ‘replyURL’ passed
        in the request with authorization code and nonce as query parameters.
      parameters:
      - name: scopes
        in: query
        required: true
        schema:
          type: string
        description: Should always be 'DERR_INSTALLER'
      - name: replyURL
        in: query
        required: true
        schema:
          type: string
        description: URL where the user has to be redirected after successful login
      - name: nonce
        in: query
        required: true
        schema:
          type: string
        description: GUID generated by the application
      - name: codeChallenge
        in: query
        required: true
        schema:
          type: string
        description: Base64 URL-encoded SHA-256 hash of the code verifier
      responses:
        '200':
          description: '200'
          content:
            application/json:
              example:
                transactionID: string
                access_token: string
                access_token_expires_in: string
                id_token: string
                refresh_token: string
                refresh_token_expires_in: string
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /logout:
    get:
      operationId: logout
      summary: logout
      tags:
      - DER Registration For Account Holders
      description: logout
      responses:
        '200':
