  /getReceipts:
    post:
      operationId: getOfAllReceiptsAssociatedWithSingleOrMultipleDERRecords
      summary: Get of all receipts associated with single or multiple DER Records.
      tags:
      - DER Registration For Account Holders
      description: This API is used by participants to get a list of all receipts associated with single
        or multiple DER Records based on the supplied filter(s).
      parameters:
      - name: x-initiatingParticipantID
        in: header
        required: true
        schema:
          type: string
        description: The participant ID who the request is from.
      - name: X-market
        in: header
        required: true
        schema:
          type: string
        description: The market the request is for.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: bearer token
      requestBody:
        content:
          application/json:
            example:
              data:
                modifiedDateFrom: string
                modifiedDateTo: string
                jobReferences:
                - nmi: string
                  jobNumber: string
                  installerId: string
        description: Get receipts.
      responses:
        '200':
          description: Get receipts - Success
          content:
            application/json:
              example:
                transactionId: string
                data:
                  receipts:
                  - nmi: string
                    jobNumber: string
                    disclaimer: string
                    derJobCompleteDate: string
                    installerId: string
                    approvedCapacity: 0
                    confirmationLengthTime: 0
                    centralProtectionControl: 'Yes'
                    acConnections:
                    - connectionId: 0
                      equipmentType: Inverter
                      installedCapacity: 0
                      manufacturerName: string
                      modelNumber: string
                    devices:
                    - deviceId: 0
                      type: string
                      installedCapacity: 0
                      manufacturerName: string
                      modelNumber: string
                warnings:
                - code: string
                  title: string
                  detail: string
                  source: string
