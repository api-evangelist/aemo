        schema:
          type: string
        description: bearer token
      responses:
        '200':
          description: Get preferences - Success
          content:
            application/json:
              example:
                transactionId: string
                data:
                  contactRole: string
                  emailAddress: string
                  phoneNumber: string
                  notifications:
