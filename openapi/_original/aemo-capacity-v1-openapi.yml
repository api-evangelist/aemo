                    SegmentName: Segment 1
                    SegmentType: Forward Haul
                    FromId: 20001
                    FromName: Zone 1
                    ToId: 30001
                    ToName: Zone 2
                    ForAuctionPublication: 'Yes'
                    EffectiveDate: '2018-02-28T02:00:00Z'
                    VersionDatetime: '2018-02-01T02:23:45Z'
                    LastChanged: '2018-05-01T02:23:45Z'
