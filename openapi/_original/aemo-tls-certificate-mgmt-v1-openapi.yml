  /orders/{order-id}/reissue:
    post:
      operationId: reissueACertificate
      summary: Reissue a certificate
      tags:
      - TLS Certificate Mgmt v1
      description: "Reissue a certificate. A certificate reissue creates a new certificate with a new\
        \ CSR. By providing a CSR, a reissued certificate uses the private key for that CSR.\n       \
        \ \nTo reissue a certificate, you must provide a `csr` and `certificateCommonName` in the request\
        \ body, where the `certificateCommonName` is associated with the order-id in the request path.\n\
        \        \nThe reissued certificate is the primary certificate on the order (certificate renewals\
        \ use the primary certificate for renewal). It has the same expiry date as the original certificate\
        \ on the order.\n        \nMultiple reissues of the same certificate can be made."
      parameters:
      - name: order-id
        in: path
        required: true
        schema:
          type: string
        description: The specific order ID of a Certificate
      - name: X-InitiatingParticipantID
        in: header
        required: true
        schema:
          type: string
        description: The participant ID who the request is from.
      - name: Accept
        in: header
        required: true
        schema:
          type: string
          enum:
