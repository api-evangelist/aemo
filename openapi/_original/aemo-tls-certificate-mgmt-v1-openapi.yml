      description: Get a users scope from their given SessionID. This will provide basic information on
        whether the user has the TLS_CERTIFICATE_MANAGEMENT entity assigned, the specific ParticipantID
        associated with that entity, and the rights the user has for that entity (e.g. RUCD)
