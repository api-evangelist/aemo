          description: Success
          content:
            text/plain:
              example: ''
            application/json:
              example:
                data:
                  tradingDay: string
                  referenceTradingPrices:
                  - tradingInterval: string
                    referenceTradingPrice: 0
                    isPublished: true
                transactionId: string
            text/json:
