        in: query
        required: false
        schema:
          type: string
        description: Format - date-time (as date-time in RFC3339).
      - name: x-initiatingParticipantId
        in: header
        required: true
        schema:
          type: string
        description: The id of the Initiating Participant
      - name: x-market
        in: header
        required: true
        schema:
          type: string
        description: The id of the market
      responses:
