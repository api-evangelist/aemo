                submittingParticipantId: AEMO
                counterPartyParticipantId: AEMO
                agreementTypeId: DOLLAR
                profileTypeId: BUSINESS
                regionId: QLD1
                creditDebitIndicator: C
                submittingParticipantReference: REALLOC1
                intervalLength: 30
                reallocationProfile:
                - periodId: 36
                  reallocationValue: 30
                  nrp: 500
        description: Payload in the body
