openapi: 3.0.1
info:
  title: SelfForecast
  description: "## Introduction\nThe Self forecasting API is used by participants who wish to submit their Solar or Wind Forecasts for a DUID to AEMO.\n\nFor details on how to get access and business rules for this API:\n\n<a href=\"/api-docs\"><img src=\"./files/ViewAPIDocsButton.png\" alt=\"View API Docs\" /></a>"
  version: v1
servers:
  - url: https://api-prd.aemo.local/ws/NEMWholesale/selfForecast
paths: { }
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - { }
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]