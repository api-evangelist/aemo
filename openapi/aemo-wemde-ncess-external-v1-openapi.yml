      parameters:
      - name: dispatchIntervalFrom
        in: path
        required: true
        schema:
          type: string
        description: 'Default date format: yyyy-MM-ddTHH:mm:ss+08:00. For request, the offset +08:00 is
          optional - api will by default treat incoming time as +08:00'
      - name: dispatchIntervalTo
        in: path
        required: true
        schema:
          type: string
