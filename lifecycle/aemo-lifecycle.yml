  openapi/ (76 documents)
description: >-
  AEMO versions its APIs in Azure API Management version sets, exposes the version in the gateway
  path, and manages change through a scheduled, market-wide IT change and release programme rather
  than through a developer-facing API changelog. There is no api.status page, no published SLA or
  uptime target for the API gateway, and no Sunset/Deprecation header policy. Machine-readable
  service health for the Consumer Data Right APIs is available as an API of its own — the CDS
  Common discovery endpoints getStatus and getOutages.

versioning:
  scheme: uri-path
  mechanism: >-
    Each API is registered in APIM with an apiVersion bound to an apiVersionSetId; the version
    appears in the gateway path (for example /WEM/lfas/v2, /NEMRetail/cds-au/v1,
    /NEMWholesale/bidding).
  concurrent_versions_published: true
  examples:
    - product: System Management Reports
      versions: [v2, v2.1, v2.2, v2.3, v2.4, v2.5, v2.6]
    - product: Pre-Balancing Reports
      versions: [v6, v7, v7.1, v8]
    - product: Balancing Reports
      versions: [v2, v2.1, v2.2, v2.3, v2.4, v2.5]
    - product: WEMDE DispatchCase / DispatchSolution
      versions: [v1, v2]
    - product: Hub Message Management
      versions: [v1, v2]
    - product: DER Register (NMI / Installation)
      versions: [v1, v2]
  content_negotiation:
    applies_to: Consumer Data Right energy APIs
    headers: [x-v, x-min-v]
    standard: Consumer Data Standards Australia
    docs: https://consumerdatastandardsaustralia.github.io/standards/
  catalogue: https://dev.aemo.com.au/developer/apis?api-version=2022-04-01-preview

deprecation:
  policy_url: https://www.aemo.com.au/energy-systems/market-it-systems/it-change-and-release-management
  policy_summary: >-
    AEMO retires and changes market IT interfaces through its IT change and release management
    programme, which publishes a fortnightly forward schedule of planned IT changes and change
    (outage/maintenance) windows to market participants, alongside the status history of AEMO's
    business services. Superseded API versions remain published in the developer-portal catalogue
    alongside their replacements rather than being removed on a fixed clock.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No operation in any of the 76 OpenAPI documents is flagged `deprecated: true`, and no Sunset or
    Deprecation response header is documented anywhere in the catalogue.
  verification: >-
    The IT change and release management page is confirmed to exist and to carry the forward change
    schedule; the aemo.com.au WAF answers automated clients with HTTP 403, so the page could not be
    fetched directly during this run.

