sla:
  published: false
  uptime_target: null
  note: >-
    No API-level service level agreement or uptime commitment is published on the developer portal
    or in the API Acceptable Use Policy. Availability obligations for AEMO market systems sit in
    the market procedures rather than in a developer-facing SLA.

